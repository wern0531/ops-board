<!doctype html>
<html lang="zh-Hant" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>工廠看板</title>
<!--
  老闆看板前端（ER-134 起；ER-139 第二版：滿版、圖表優先、詳細另頁、手機只留重點）。
  單檔、零相依、零建置：推到公開 repo wern0531/ops-board，GitHub Pages 服務。
  紅線：這個檔**不含任何金鑰、資料、本機路徑**。專案網址與 publishable key 由 CEO 給的設定連結
  （#u=…&k=…）帶進來存 localStorage——片段不會送到任何伺服器，也不進 repo。
  沒登入什麼都拿不到：所有資料都要帶 Supabase 的登入 JWT 才讀得到（RLS 只開給 authenticated）。

  資訊三層，每層只回答一個問題：
    首頁＝「正常嗎？成績變好還是變差？」／分頁＝總覽・頻道・影片成績・產線・成本／詳細＝一支片一頁。
    彈窗只用在決策卡（摘要＋三顆按鈕＋文件連結），其他細節一律另一頁。
  圖全部手畫 SVG，不載任何圖表庫。
  兩列快照：current（20 秒一輪，產線狀態）＋analytics（一天一次，趨勢與圖表）。
-->
<style>
/* ER-140 樣式 A（冷調精簡）：中性灰階＋**一個**強調色，1px 細邊框，卡 12px／控制項 8px 圓角，
   數字一律等寬。舊的米色／多強調色色票（--accent2、--shadow）已退休。 */
:root{
  --bg:#f6f7f8; --card:#ffffff; --line:#e3e5e8; --soft:#f0f1f3;
  --ink:#14161a; --dim:#5c6269;
  --accent:#3755d8; --accent-ink:#ffffff; --accent-soft:#edf0fd;
  --ok:#0f6b4f; --warn:#7d5300; --bad:#a82920;
  --series2:#6b7280;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0e10; --card:#15171a; --line:#272a2f; --soft:#1d2024;
  --ink:#e9eaec; --dim:#9aa0a8;
  --accent:#8098f9; --accent-ink:#0d0e10; --accent-soft:#1b2033;
  --ok:#4cc38a; --warn:#d6a23d; --bad:#ef6a60;
  --series2:#8b919a;
}}
html[data-theme=light]{--bg:#f6f7f8;--card:#ffffff;--line:#e3e5e8;--soft:#f0f1f3;
  --ink:#14161a;--dim:#5c6269;--accent:#3755d8;--accent-ink:#ffffff;--accent-soft:#edf0fd;
  --ok:#0f6b4f;--warn:#7d5300;--bad:#a82920;--series2:#6b7280}
html[data-theme=dark]{--bg:#0d0e10;--card:#15171a;--line:#272a2f;--soft:#1d2024;
  --ink:#e9eaec;--dim:#9aa0a8;--accent:#8098f9;--accent-ink:#0d0e10;--accent-soft:#1b2033;
  --ok:#4cc38a;--warn:#d6a23d;--bad:#ef6a60;--series2:#8b919a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
body.lock{overflow:hidden}
b,strong,.num,.kpi b,td,th,.bv,.pill{font-variant-numeric:tabular-nums}
.page{padding:12px 16px 28px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
h1{font-size:17px;margin:0;letter-spacing:-.01em}
h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-weight:600;letter-spacing:-.01em}
h2 .c{color:var(--dim);font-size:12px;font-weight:400;letter-spacing:0}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding:9px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar.red{border-bottom-color:var(--bad);box-shadow:inset 0 2px 0 var(--bad)}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);
  white-space:nowrap;color:var(--dim);background:var(--card)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.big{font-size:13px;font-weight:600;background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink);cursor:pointer}
.dim{color:var(--dim);font-size:12px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi span.t{color:var(--dim);font-size:12px;display:block}
.kpi b{display:block;font-size:24px;font-weight:600;line-height:1.2;letter-spacing:-.02em;margin:2px 0}
.kpi.red b{color:var(--bad)}
.kpi .d{font-size:12px;display:flex;align-items:center;gap:4px}
.kpi .d.up{color:var(--ok)}.kpi .d.down{color:var(--bad)}.kpi .d.flat{color:var(--dim)}
.mid{display:grid;gap:12px;grid-template-columns:minmax(0,2fr) minmax(0,1fr);margin:12px 0}
.row{border-top:1px solid var(--line);padding:10px 0}
.row:first-of-type{border-top:0}
.chip{display:inline-block;width:8px;height:8px;border-radius:2px;vertical-align:middle;margin-right:6px}
/* 卡片固定三層：標籤一行→標題一行（人話、可換行）→說明一行 */
.k-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim)}
.k-title{font-size:15px;font-weight:600;margin:4px 0 2px;line-height:1.45;overflow-wrap:anywhere}
.k-note{font-size:13px;color:var(--dim);overflow-wrap:anywhere}
/* ER-142 本週行事曆：桌機七格並排，手機一天一列（精簡版） */
.cal7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 2px}
.cal{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px;min-height:58px}
.cal.now{border-color:var(--accent);background:var(--accent-soft)}
.cal .k-note{margin-top:4px}
@media (max-width:820px){.cal7,.cal7.mini{grid-template-columns:1fr}
  .cal{min-height:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);padding:7px 12px;min-height:34px;display:inline-flex;align-items:center;gap:6px;
  text-decoration:none;white-space:nowrap}
button:hover,.btn:hover{background:var(--soft)}
button.p,.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.p:hover,.btn.p:hover{filter:brightness(1.08)}
button.g{background:transparent;border-color:transparent;color:var(--dim)}
button.g:hover{background:var(--soft);color:var(--ink)}
button.bad{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
.ico{width:14px;height:14px;flex:0 0 14px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
/* 文字連結：不是瀏覽器預設藍底線；外連帶 ↗ */
a.lnk{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
a.lnk:hover{border-bottom-color:var(--accent)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;width:100%;min-height:36px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:72px;resize:vertical}
.hint{color:var(--bad);font-size:12px;margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap;vertical-align:middle}
th{color:var(--dim);font-weight:500}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.muted{opacity:.6}
.tabs{display:flex;gap:6px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--card)}
.tabs button{border:0;border-radius:0;background:transparent;color:var(--dim);min-height:38px;
  border-bottom:2px solid transparent;padding:6px 4px;margin-right:10px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.bc{position:relative;height:6px;background:var(--soft);border:1px solid var(--line);border-radius:999px;min-width:70px}
.bc i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bc u{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink);opacity:.7}
.bv{font-size:11px;color:var(--dim)}
.mix{display:flex;height:10px;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.mix i{display:block;height:100%}
svg{display:block;width:100%;height:auto}
.spark{width:112px;height:24px}
.doc{position:fixed;inset:0;background:rgba(10,11,13,.6);display:flex;align-items:center;justify-content:center;
  z-index:20;padding:12px}
.doc>div{background:var(--card);width:100%;max-width:640px;max-height:86vh;overflow:auto;
  border:1px solid var(--line);border-radius:12px;padding:16px}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.65 ui-monospace,"Noto Sans TC",monospace;margin:0}
.login{max-width:330px;margin:14vh auto}
.err{color:var(--bad);font-size:13px;margin-top:8px;word-break:break-word}
.stat{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
/* 提示（取代 alert／confirm）：桌機右下、手機底部 */
.toasts{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;gap:8px;
  max-width:330px}
.toast{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:13px;display:flex;gap:8px;align-items:center}
.toast.bad{border-color:var(--bad)}
.toast .x{margin-left:auto}
.spin{width:13px;height:13px;flex:0 0 13px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.busy{opacity:.5}
/* ER-162 首頁：圖表優先的營運總覽（取代舊的六格 KPI 與「桌機一套、手機一套」兩份版面）。 */
.hero{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:0 0 12px}
.hero h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.m4{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));margin:0 0 12px}
.m4 .box{margin:0;display:flex;flex-direction:column;gap:8px}
.big{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em}
.seg{display:grid;gap:4px}
.seg i{height:10px;border-radius:3px;background:var(--soft);border:1px solid var(--line);display:block}
.seg i.on{background:var(--accent);border-color:var(--accent)}
.seg i.wait{border-color:var(--accent);
  background:repeating-linear-gradient(135deg,var(--accent) 0 4px,var(--accent-soft) 4px 8px)}
.two{display:grid;gap:12px;grid-template-columns:minmax(0,3fr) minmax(0,2fr);margin:0 0 12px}
.two .box{margin:0}
.ask{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border:1px solid var(--line);
  border-radius:10px;padding:10px;margin-top:10px}
.thumb{width:112px;height:63px;flex:none;border-radius:8px;background:var(--soft);
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;color:var(--dim);font-size:11px}
.thumb b{font-size:13px;color:var(--ink)}
img.thumb{display:block;object-fit:cover;cursor:zoom-in}   /* ER-163 B5：真的縮圖 */
.note{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.note u{flex:none;margin-top:6px;width:8px;height:8px;border-radius:50%;text-decoration:none}
.chs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(350px,1fr))}
.st3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.st3>div{background:var(--soft);border-radius:8px;padding:8px 10px}
.st3 b{display:block;font-size:18px;font-weight:600}
.stg{display:grid;gap:4px;margin:6px 0 2px}
.stg>div{min-width:0;display:flex;flex-direction:column;gap:5px}
.stg i{height:6px;border-radius:3px;background:var(--soft);display:block}
.stg i.on{background:var(--accent)}
.stg em{font-size:11px;color:var(--dim);font-style:normal;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.stg b{font-size:11px;font-weight:600;align-self:flex-start;padding:1px 5px;border-radius:6px;
  background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:2px;height:92px;border-bottom:1px solid var(--line)}
.bars i{flex:1 1 0;display:block;min-height:2px;border-radius:2px 2px 0 0;background:var(--accent);
  opacity:.45}
.bars i.pub{opacity:1}
.bars i.none{opacity:1;height:10px;
  background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px)}
.vrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) 74px;gap:12px;
  align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.vrow .num{text-align:right;font-weight:600}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m4 .spark{width:100%;height:38px}
.nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);
  border-top:1px solid var(--line);padding:4px}
.nav button{flex:1;border:0;background:transparent;font-size:13px;min-height:44px;justify-content:center}
.nav button[aria-selected=true]{color:var(--accent);font-weight:600}
@media (max-width:820px){
  .desk{display:none!important}
  .nav{display:flex}
  .page{padding:10px 12px 70px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mid{grid-template-columns:minmax(0,1fr)}
  .m4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.chs{grid-template-columns:1fr}
  .vrow{grid-template-columns:minmax(0,1fr) 66px}
  .vrow .bc{grid-column:1/-1}
  .thumb{width:88px;height:50px}
  .stg em{white-space:normal;font-size:10px;line-height:1.25}
  .tabs{display:none}
  .bar{padding:9px 12px}
  .toasts{left:12px;right:12px;bottom:56px;max-width:none}
}
</style>

<body>
<div id="app"></div>
<script>
"use strict";
var LS="aicc-board";
var cfg=null, tok=null, snap=null, ana=null, at="", anaAt="", timer=null;
/* ER-140：view.card 是**卡號**（不是 snap.inbox 的索引——自動重讀後索引會指到別張卡）。
   notes＝使用者正在寫的「改」意見（重畫不掉）；busy＝已送出等落地的卡號；
   confirm＝「准」的第二段確認；toasts＝右下角提示（取代 alert／confirm）。 */
/* ER-142：poolOpt＝卡池「擋下／解除」的樂觀覆蓋（按下就生效，不等 60 秒那輪快照）；
   poolAsk＝擋下／解除的確認彈窗（不用原生 confirm）。 */
var view={tab:"home", ch:"", vid:"", card:null, doc:null, err:"",
          notes:{}, busy:{}, confirm:"", hint:"", noteOpen:"", toasts:[],
          poolOpt:{}, poolAsk:null};
var toastSeq=0, deferred=false;
var DESK=[["home","總覽"],["channels","頻道"],["scores","影片成績"],["line","產線"],["cost","成本"]];
var MOB=[["home","首頁"],["inbox","等你"],["scores","成績"],["line","產線"]];

/* ---------- 設定（專案網址＋publishable key）：只從設定連結或 localStorage 來 ---------- */
function readFragment(){
  var h=location.hash.replace(/^#/,""); if(!h) return null;
  var p=new URLSearchParams(h), u=p.get("u"), k=p.get("k");
  if(!u||!k) return null;
  var c={url:u.replace(/\/+$/,""),key:k};
  localStorage.setItem(LS+"-cfg",JSON.stringify(c));
  history.replaceState(null,"",location.pathname+location.search);   // 片段不留在網址列
  return c;
}
function loadCfg(){
  return readFragment()||JSON.parse(localStorage.getItem(LS+"-cfg")||"null");
}
function loadTok(){ return JSON.parse(localStorage.getItem(LS+"-tok")||"null"); }
function saveTok(t){ tok=t; t?localStorage.setItem(LS+"-tok",JSON.stringify(t)):localStorage.removeItem(LS+"-tok"); }

/* ---------- Supabase（手寫 fetch，不載任何第三方 SDK） ---------- */
function api(path,opt){
  opt=opt||{};
  var h={apikey:cfg.key,"Content-Type":"application/json"};
  if(tok&&tok.access_token) h.Authorization="Bearer "+tok.access_token;
  Object.keys(opt.headers||{}).forEach(function(k){h[k]=opt.headers[k];});
  return fetch(cfg.url+path,{method:opt.method||"GET",headers:h,
    body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){
    return r.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){ j=t; }
      return {ok:r.ok,status:r.status,data:j};
    });
  });
}
function login(email,pw){
  return api("/auth/v1/token?grant_type=password",{method:"POST",body:{email:email,password:pw}})
    .then(function(r){
      if(!r.ok) throw new Error((r.data&&(r.data.error_description||r.data.msg||r.data.error))||("登入失敗 "+r.status));
      saveTok(r.data); return r.data;
    });
}
function refresh(){
  if(!tok||!tok.refresh_token) return Promise.reject(new Error("沒有登入"));
  return api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:{refresh_token:tok.refresh_token}})
    .then(function(r){ if(!r.ok) throw new Error("登入過期"); saveTok(r.data); return r.data; });
}
function authed(path,opt){                       // 401 先換一次 token，再失敗才真的登出
  return api(path,opt).then(function(r){
    if(r.status!==401) return r;
    return refresh().then(function(){ return api(path,opt); });
  });
}
function fetchSnap(auto){                        // 兩列一次拿：current（產線）＋analytics（圖表）
  return authed("/rest/v1/board_snapshot?key=in.(current,analytics)&select=key,at,data")
    .then(function(r){
    if(!r.ok) throw new Error("讀不到資料（"+r.status+"）");
    if(!r.data||!r.data.length) throw new Error("還沒有快照（本機還沒推第一輪）");
    r.data.forEach(function(row){
      if(row.key==="analytics"){ ana=row.data; anaAt=row.at; }
      else { snap=row.data; at=row.at; }
    });
    if(!snap) throw new Error("只有分析資料，還沒有產線快照");
    view.err=""; afterSnap(auto);
  }).catch(function(e){ view.err=e.message||String(e); render(auto); });
}
/* 重讀之後：開著的彈窗那張卡不在了就關掉並說一聲（絕不改成指到別張卡）。 */
function afterSnap(auto){
  /* 卡池：本機那一輪已經把擋下落地（快照跟樂觀值一致）→ 覆蓋清掉，回歸快照為準 */
  (snap.channels||[]).forEach(function(c){
    (c.pool||[]).forEach(function(p){
      var k=c.slug+":"+p.tc;
      if(view.poolOpt[k]!==undefined&&view.poolOpt[k]===!!p.blocked) delete view.poolOpt[k];
    });
  });
  if(view.card&&!cardOf(view.card)){
    var gone=view.card;
    view.card=null; view.confirm=""; view.hint=""; lockScroll(false);
    delete view.notes[gone];
    if(!view.busy[gone]) toast("這張卡已被處理（"+gone+"），彈窗已關閉","bad");
    render(); return;
  }
  render(auto);
}
function cardOf(id){
  var rows=(snap&&snap.inbox)||[];
  for(var i=0;i<rows.length;i++) if(rows[i].card===id) return rows[i];
  return null;
}
/* ---------- 提示（取代 alert／confirm；桌機右下、手機底部） ---------- */
function toast(text,kind,retry){
  var t={id:++toastSeq,text:text,kind:kind||"",retry:retry||null};
  view.toasts.push(t);
  if(kind!=="bad") setTimeout(function(){ dropToast(t.id); },4500);
  renderToasts(); return t.id;
}
function dropToast(id){
  view.toasts=view.toasts.filter(function(t){ return t.id!==id; });
  renderToasts();
}
function toastsHtml(){
  return '<div class="toasts" id="toasts">'+view.toasts.map(function(t){
    return '<div class="toast'+(t.kind?" "+t.kind:"")+'">'
      +(t.kind==="wait"?'<span class="spin"></span>':"")+'<span>'+esc(t.text)+'</span>'
      +(t.retry?'<button class="g" data-retry="'+t.id+'">重試</button>':"")
      +'<button class="g x" data-tdrop="'+t.id+'" aria-label="關閉提示">'+ico("x")+'</button></div>';
  }).join("")+'</div>';
}
function renderToasts(){                         // 只換提示那一塊，不整頁重畫
  var host=document.getElementById("toasts");
  if(!host){ render(); return; }
  host.outerHTML=toastsHtml();
  wireToasts();
}
function sendAction(a){
  return authed("/rest/v1/board_actions",{method:"POST",body:[a],
    headers:{Prefer:"return=representation"}}).then(function(r){
    if(!r.ok) throw new Error((r.data&&(r.data.message||r.data.hint))||("送不出去 "+r.status));
    return r.data[0];
  });
}
function waitAction(id,cb){                      // 等本機那一輪把它落地（applied_at 回填）
  var n=0;
  var iv=setInterval(function(){
    n++;
    authed("/rest/v1/board_actions?id=eq."+id+"&select=applied_at,result").then(function(r){
      var row=r.ok&&r.data&&r.data[0];
      if(row&&row.applied_at){ clearInterval(iv); cb(row.result||"已落地",true); fetchSnap(); }
      else if(n>40){ clearInterval(iv); cb("本機還沒收到（下一輪會處理）",false); }
    });
  },5000);
}

/* ---------- 送出一個動作：立刻關彈窗＋卡變處理中＋提示（ER-140） ---------- */
function submit(card,action,label,again){
  view.busy[card]=true;
  closeCard();
  var tid=toast("已送出："+label,"wait");
  return sendAction(action).then(function(row){
    waitAction(row.id,function(res){
      dropToast(tid); delete view.busy[card];
      toast("已完成："+res); render();
    });
  }).catch(function(e){
    dropToast(tid); delete view.busy[card];
    toast("送不出去："+(e.message||e),"bad",again||null);
    render();
  });
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function na(v,suf){ return (v===null||v===undefined||v==="")?'<span class="dim">量不到</span>':esc(v)+(suf||""); }
function fmt(n){
  if(n===null||n===undefined||n==="") return "—";
  var x=Math.round(Number(n)*10)/10;
  return String(x).replace(/\B(?=(\d{3})+(?!\d))/g,",");

function ago(s){
  var t=Date.parse(String(s||"").replace(" ","T")); if(!t) return "";
  var m=Math.round((Date.now()-t)/60000);
  return m<1?"剛剛":(m<60?m+" 分前":Math.floor(m/60)+" 小時前");
}

/* ER-161：近 7 天觀看只算到報表完整那天，報表未到的日子是「未到」不是 0。
   兩段加總都在後端算（board_server.window_sum），前端只加各頻道的數字；
   任何一台算不出完整的 7 天就整個回 null（顯示「量不到」，不給假的漲跌）。 */
function views7(key){
  var cs=anaChs(), t=0, got=false;
  for(var i=0;i<cs.length;i++){
    var v=cs[i][key];
    if(v==null) return null;
    t+=v; got=true;
  }
  return got?t:null;
}
function reportThrough(){                        // 報表到哪天（多台取最舊的那天，才不會高估）
  var cs=anaChs(), out="";
  for(var i=0;i<cs.length;i++){
    var d=cs[i].report_through||"";
    if(!d) return "";
    if(!out||d<out) out=d;
  }
  return out;
}
function totalViews(){                           // 累計觀看＝各台 Data API statistics.viewCount
  var cs=anaChs(), t=0, got=false;
  for(var i=0;i<cs.length;i++){
    var v=(cs[i].live||{}).total_views;
    if(v==null) continue;
    t+=v; got=true;
  }
  return got?t:null;
}
function latestSnap(v){                          // 一支片最後一格有資料的快照
  var got=null;
  ["48h","7d","28d"].forEach(function(k){
    var s=(v.snaps||{})[k];
    if(s&&(s.views!=null||s.avp!=null)) got=Object.assign({key:k},s);
  });
  return got;
}
function avgOf(key){
  var xs=allVideos().map(function(v){ var s=latestSnap(v); return s?s[key]:null; })
            .filter(function(x){return x!=null;});
  return xs.length?Math.round(xs.reduce(function(a,b){return a+b;},0)/xs.length*10)/10:null;
}

/* ---------- 手畫 SVG（不載圖表庫） ---------- */
function niceMax(v){
  if(!v||v<=0) return 1;
  var p=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)), n=v/p;
  return p*(n<=1?1:n<=2?2:n<=5?5:10);
}
function svgLines(labels,series,marks,h,xf){
  h=h||260; xf=xf||function(s){ return s; };
  var W=1000, L=48, R=12, T=14, B=26;
  var max=1;
  series.forEach(function(s){ (s.pts||[]).forEach(function(v){ if(v>max) max=v; }); });
  max=niceMax(max);
  var n=labels.length, iw=W-L-R, ih=h-T-B;
  var X=function(i){ return L+(n<2?iw/2:iw*i/(n-1)); };
  var Y=function(v){ return T+ih-ih*(Number(v||0)/max); };
  var g="";
  for(var k=0;k<=4;k++){
    var val=max*k/4, y=Y(val);
    g+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="currentColor" stroke-opacity=".16"/>'
      +'<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="currentColor" fill-opacity=".55">'
      +fmt(val)+'</text>';
  }
  [0,Math.floor((n-1)/2),n-1].forEach(function(i,j){
    if(i<0||!labels[i]) return;
    g+='<text x="'+X(i)+'" y="'+(h-7)+'" text-anchor="'+(j===0?"start":j===2?"end":"middle")
      +'" font-size="12" fill="currentColor" fill-opacity=".55">'+esc(xf(String(labels[i])))+'</text>';
  });
  (marks||[]).forEach(function(m){
    if(m.i<0||m.i>=n) return;
    g+='<line x1="'+X(m.i)+'" y1="'+T+'" x2="'+X(m.i)+'" y2="'+(h-B)+'" stroke="'+(m.color||"currentColor")
      +'" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity=".7"><title>'+esc(m.label||"")+'</title></line>'
      +'<circle cx="'+X(m.i)+'" cy="'+(T+4)+'" r="4" fill="'+(m.color||"currentColor")+'"><title>'
      +esc(m.label||"")+'</title></circle>';
  });
  series.forEach(function(s){
    var pts=s.pts||[]; if(!pts.length) return;
    var d=pts.map(function(v,i){ return (i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1); }).join(" ");
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" stroke-linejoin="round"/>';
  });
  return '<svg viewBox="0 0 '+W+' '+h+'" role="img">'+g+'</svg>';
}
function legend(series){
  return '<div class="stat">'+series.map(function(s){
    return '<span><span class="chip" style="background:'+s.color+'"></span>'+esc(s.name)+'</span>';
  }).join("")+'</div>';
}
function spark(pts,color){
  pts=(pts||[]).filter(function(v){return v!=null;});
  if(pts.length<2) return '<div class="dim">趨勢還不夠畫</div>';
  var W=112,H=26,max=Math.max.apply(null,pts)||1,min=Math.min.apply(null,pts);
  var rng=(max-min)||1;
  var d=pts.map(function(v,i){
    return (i?"L":"M")+(i*(W-2)/(pts.length-1)+1).toFixed(1)+" "+(H-1-(v-min)/rng*(H-3)).toFixed(1);
  }).join(" ");
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img">'
    +'<path d="'+d+'" fill="none" stroke="'+(color||"var(--accent)")+'" stroke-width="1.8"/></svg>';
}
function meter(v,cap,alt){                        // 進度條；超上限變紅
  if(v==null||cap==null||!cap) return '<div class="dim">'+(alt||"沒有上限可比")+'</div>';
  var pct=v/cap*100, over=pct>100;
  return '<div class="bc"><i class="'+(over?"":"")+'" style="width:'+Math.min(100,Math.max(2,pct)).toFixed(0)+'%;'
    +(over?"background:var(--bad)":"")+'"></i></div>'
    +'<span class="bv">'+fmt(v)+' ／ '+fmt(cap)+'（'+pct.toFixed(0)+'%）</span>';
}
function barCell(v,max,pred,suf){                 // 一根條＋刻線（刻線＝阿題預測）
  if(v==null) return '<td class="dim">量不到</td>';
  var w=Math.min(100,Math.max(2,100*v/(max||1)));
  var t=(pred!=null&&max)?Math.min(100,100*pred/max):null;
  return '<td><div class="bc"><i style="width:'+w.toFixed(0)+'%"></i>'
    +(t!=null?'<u style="left:'+t.toFixed(0)+'%" title="預測 '+fmt(pred)+'"></u>':'')+'</div>'
    +'<span class="bv">'+fmt(v)+(suf||"")+(pred!=null?'（預測 '+fmt(pred)+(suf||"")+'）':'')+'</span></td>';
}

/* 指標卡：標籤→大數字→漲跌（跟前一期比，算不出來就不顯示，不假裝）→迷你趨勢。 */
function delta(now,prev,what){
  if(now==null||prev==null||!prev) return "";
  var p=(now-prev)/Math.abs(prev)*100;
  var cls=p>1?"up":(p<-1?"down":"flat"), mark=p>1?"▲":(p<-1?"▼":"＝");
  return '<div class="d '+cls+'">'+mark+' '+Math.abs(p).toFixed(0)+'%'
    +'<span class="dim">'+esc(what||"比前一期")+'</span></div>';
}
function kpiTile(title,val,note,red,dl){
  return '<div class="kpi'+(red?" red":"")+'"><span class="t">'+esc(title)+'</span><b>'+val+'</b>'
    +(dl||"")+(note?'<div class="dim">'+note+'</div>':"")+'</div>';
}
function dailyChart(){
  var cs=anaChs();
  if(!cs.length) return '<div class="box"><h2>每日觀看</h2><div class="dim">'
    +(ana?"這個頻道還沒有分析資料":"還沒推分析資料（每天跟著量測推一次）")+'</div></div>';
  var labels=[], L=[], S=[];
  (cs[0].daily||[]).forEach(function(x,i){ labels.push(x.d); L[i]=0; S[i]=0; });
  if(!labels.length) return '<div class="box"><h2>每日觀看</h2>'
    +'<div class="dim">量不到：分析資料裡沒有逐日觀看</div></div>';
  cs.forEach(function(c){ (c.daily||[]).forEach(function(x,i){ L[i]+=(x.long||0); S[i]+=(x.short||0); }); });
  var marks=[];
  cs.forEach(function(c){ (c.publishes||[]).forEach(function(p){

/* 一張卡固定三層：標籤（類型・片號・頻道・時間）→標題（人話，可換行不截斷）→說明。
   鍵是卡號（data-open＝卡號），不是陣列索引。 */
function kindLabel(r){ return r.kind==="related"?"設相關影片":"決策卡"; }
/* 標題一行、說明一行：佇列裡的決策卡標題常有兩三百字（整張卡的細節都塞在標題），
   這裡在第一個「：」或「——」切開——標題不截斷也不會變成一面牆，細節落到說明欄。 */
function titleParts(r,full){
  var t=String(r.title||""), n=r.note||"";
  if(!n&&t.length>60){
    var m=t.match(/^([^：；]{8,60}?)(?:——|：|；)\s*([\s\S]+)$/);
    if(m){ t=m[1]; n=m[2]; } else { n=t.slice(56); t=t.slice(0,56); }
  }
  if(!full&&n.length>120) n=n.slice(0,120)+"…（打開卡看全部）";
  return {t:t,n:n};
}

function retChart(v){
  var pts=(v.retention||[]);
  if(!pts.length) return '<div class="dim">量不到：'+esc(v.ret_why||"沒有留存資料")+'</div>';
  var labels=pts.map(function(p){ return Math.round(p.x*100)+"% 處"; });
  var series=[{name:"觀眾留存",color:"var(--accent)",pts:pts.map(function(p){return p.ratio;})}];
  var marks=[];
  if(v.ret_drop){
    var i=pts.map(function(p){return p.x;}).indexOf(v.ret_drop.x);
    if(i>=0) marks.push({i:i,color:"var(--bad)",
      label:"最大掉點：片長 "+Math.round(v.ret_drop.x*100)+"% 處掉 "+v.ret_drop.drop});
  }
  return svgLines(labels,series,marks,200)+legend(series)
    +'<div class="dim">'+(v.ret_drop?("最大掉點在片長 "+Math.round(v.ret_drop.x*100)+"%（掉 "
      +v.ret_drop.drop+"）"):"沒有明顯掉點")+'</div>';
}
function mixBar(v){
  var t=(v.traffic||[]);

  return '<div class="mix">'+t.map(function(x,i){
      return '<i style="width:'+(x.pct||0)+'%;background:'+cols[i%cols.length]+'" title="'
        +esc(x.zh)+' '+(x.pct||0)+'%"></i>';
    }).join("")+'</div>'
    +'<div class="stat">'+t.map(function(x,i){
      return '<span><span class="chip" style="background:'+cols[i%cols.length]+'"></span>'

      +esc(r.card)+'">'+head+inner+'</div></div>';
  };
  if(r.kind==="related"){
    return wrap('<div class="stat">這支 Shorts '+esc(r.due)+' 公開</div>'
      +'<div class="acts"><a class="btn" href="'+esc(r.url)+'" target="_blank" rel="noopener">'
      +'到 Studio 設定 ↗</a>'
      +'<button class="p" data-rel="'+esc(r.card)+'">已設好</button></div>');
  }
  var docs=(r.docs||[]).map(function(d,j){
    return '<button class="g" data-doc="'+esc(r.card)+"|"+j+'">'+ico("doc")+esc(d.label)+'</button>';
  }).join("");
  var okTxt=view.confirm===r.card?("確定放行 "+(r.build||r.card)+"？"):"准";
  return wrap((r.gate_open?'<div class="k-note">關卡開著，裁「准」會立刻放行 '
                           +esc(r.build||r.card)+'。</div>'
                          :'<div class="k-note">關卡已過・卡未結，裁示只寫回決策卡。</div>')
    +'<div class="stat">提出 '+esc(r.date)+'・期限 '+esc(r.due)+'・逾期預設：'+esc(r.default||"—")+'</div>'
    +(docs?'<div class="acts">'+docs+'</div>':"")
    +'<div class="acts">'
    +(r.ambiguous?'<select id="amb" style="width:auto">'+(snap.channels||[]).map(function(x){
        return '<option value="'+esc(x.slug)+'">'+esc(x.name)+'</option>';}).join("")+'</select>':"")
    +'<button class="p" data-act="'+esc(r.card)+'|准">'+esc(okTxt)+'</button>'
    +'<button data-act="'+esc(r.card)+'|不動">不動</button>'
    +'<button data-act="'+esc(r.card)+'|改">改…</button></div>'
    +(view.noteOpen===r.card?'<div style="margin-top:8px">'
      +'<textarea id="note" placeholder="要改什麼？一句話（會跟著裁示寫回決策卡）">'
      +esc(view.notes[r.card]||"")+'</textarea>'
      +(view.hint?'<div class="hint">'+esc(view.hint)+'</div>':"")
      +'<div class="acts"><button class="p" data-send="'+esc(r.card)+'">送出「改」</button></div></div>':""));
}
function docPage(){
  var d=view.doc;
  return '<div class="page"><div class="box"><h2>'+esc(d.title)
    +'<button class="g" id="back" style="margin-left:auto">'+ico("left")+'返回</button></h2>'
    +(d.truncated?'<div class="dim">（太長，只推了前面一段）</div>':"")
    +'<pre>'+esc(d.text)+'</pre></div></div>';
}

/* ---------- 組裝 ---------- */
function body(){
  if(view.doc) return docPage();
  if(view.vid) return videoPage();
  if(view.tab==="channels") return channelsPage();
  /* ER-162：全頻道每日觀看那張大圖退到「影片成績」這一頁 */
  if(view.tab==="scores") return '<div class="page">'+dailyChart()+scoreTable(0)+'</div>';
  if(view.tab==="line") return linePage();
  if(view.tab==="cost") return costPage();
  if(view.tab==="inbox") return inboxPage();
  return home();
}
/* 自動重讀（60 秒一輪）不得把老闆正在寫的字或開著的彈窗清掉：整頁重畫延後到彈窗關上
   或輸入框空了為止（deferred），關上時再補一次重讀。 */
function editing(){
  if(view.card||view.poolAsk) return true;
  var ae=document.activeElement;
  if(ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT")) return true;
  return Object.keys(view.notes).some(function(k){ return (view.notes[k]||"").trim()!==""; });
}
function render(auto){
  if(!snap) return false;
  if(auto&&editing()){ deferred=true; return false; }
  var app=document.getElementById("app");
  app.innerHTML=bar()+(view.err?'<div class="page"><div class="box err">'+esc(view.err)+'</div></div>':"")
    +body()+cardModal()+poolModal()+nav()+toastsHtml();
  wire();
  lockScroll(!!view.card||!!view.poolAsk);
  var dlg=document.querySelector(".doc [data-act],.doc button");   // 焦點進入彈窗
  if(view.card&&dlg&&dlg.focus) dlg.focus();
  return true;
}
function openCard(id){
  if(!cardOf(id)){ toast("這張卡已經不在了（"+id+"）","bad"); return; }
  view.card=id; view.confirm=""; view.hint=""; view.noteOpen=""; render();
}
function closeCard(){                             // 關上就把草稿丟掉（草稿只活在彈窗開著的時候）
  var id=view.card;
  view.card=null; view.confirm=""; view.hint=""; view.noteOpen="";
  if(id) delete view.notes[id];
  lockScroll(false);
  render();
  if(deferred){ deferred=false; fetchSnap(); }
}
function go(tab){ view.tab=tab; view.vid=""; view.doc=null; view.poolAsk=null;
  closeCard(); window.scrollTo(0,0); }
function each(sel,fn){ Array.prototype.forEach.call(document.querySelectorAll(sel),fn); }
function wireToasts(){
  each("[data-tdrop]",function(b){ b.onclick=function(){ dropToast(+b.getAttribute("data-tdrop")); }; });
  each("[data-retry]",function(b){ b.onclick=function(){
    var t=view.toasts.filter(function(x){ return x.id===+b.getAttribute("data-retry"); })[0];
    if(t&&t.retry){ dropToast(t.id); t.retry(); } }; });
}
function wire(){
  wireToasts();
  var sel=document.getElementById("chsel");
  if(sel) sel.onchange=function(){ view.ch=sel.value; view.vid=""; render(); window.scrollTo(0,0); };
  var th=document.getElementById("th");
  if(th) th.onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var nx=cur==="dark"?"light":(cur==="light"?"auto":"dark");
    document.documentElement.setAttribute("data-theme",nx); localStorage.setItem(LS+"-theme",nx);
  };
  var out=document.getElementById("out");
  if(out) out.onclick=function(){ saveTok(null); snap=null; clearInterval(timer); renderLogin("已登出"); };
  var tg=document.getElementById("togo");
  if(tg) tg.onclick=function(){ go("inbox"); };
  var bk=document.getElementById("back");
  if(bk) bk.onclick=function(){ view.doc?(view.doc=null):(view.vid=""); render(); };
  each("[data-tab]",function(b){ b.onclick=function(){ go(b.getAttribute("data-tab")); }; });
  each("[data-vid]",function(b){ b.onclick=function(){
    view.vid=b.getAttribute("data-vid"); view.card=null; render(); window.scrollTo(0,0); }; });
  each("[data-open]",function(b){ b.onclick=function(){ openCard(b.getAttribute("data-open")); }; });
  var mx=document.getElementById("mx"), mbg=document.getElementById("mbg");
  if(mx) mx.onclick=function(){ closeCard(); };
  if(mbg) mbg.onclick=function(e){ if(e.target===mbg) closeCard(); };
  var ta=document.getElementById("note");
  if(ta) ta.oninput=function(){ view.notes[view.card]=ta.value; view.hint=""; };
  each("[data-doc]",function(b){ b.onclick=function(){
    var p=b.getAttribute("data-doc").split("|"), r=cardOf(p[0]);
    view.doc=((r&&r.docs)||[])[+p[1]]; closeCard(); window.scrollTo(0,0); }; });
  each("[data-act]",function(b){ b.onclick=function(){
    var p=b.getAttribute("data-act").split("|"); act(p[0],p[1]); }; });
  each("[data-send]",function(b){ b.onclick=function(){ sendNote(b.getAttribute("data-send")); }; });
  each("[data-rel]",function(b){ b.onclick=function(){ relDone(b.getAttribute("data-rel")); }; });
  each("[data-pool]",function(b){ b.onclick=function(){
    var p=b.getAttribute("data-pool").split(":"), c=ch(p[0]);
    var card=((c&&c.pool)||[]).filter(function(x){ return x.tc===p[1]; })[0]||{};
    view.poolAsk={slug:p[0],tc:p[1],un:p[2]==="un",title:card.title||""}; render(); }; });
  var px=document.getElementById("px"), pbg=document.getElementById("pbg");
  if(px) px.onclick=function(){ view.poolAsk=null; render(); };
  if(pbg) pbg.onclick=function(e){ if(e.target===pbg){ view.poolAsk=null; render(); } };
  var pno=document.getElementById("pno");
  if(pno) pno.onclick=function(){ view.poolAsk=null; render(); };
  var pok=document.getElementById("pok");
  if(pok) pok.onclick=function(){
    var a=view.poolAsk; if(a) poolToggle(a.slug,a.tc,a.un); };
}
/* ---------- 動作：都以卡號為鍵，送出成功就關彈窗、卡變處理中、結果走提示 ---------- */
function act(card,verdict){
  var r=cardOf(card);
  if(!r){ closeCard(); toast("這張卡已被處理（"+card+"）","bad"); return; }
  if(verdict==="改"){ view.noteOpen=card; view.confirm=""; view.hint=""; render();
    var ta=document.getElementById("note"); if(ta&&ta.focus) ta.focus(); return; }
  if(verdict==="准"&&view.confirm!==card){      // 二段確認：按一次先變成問句，不用原生 confirm
    view.confirm=card; render(); return;
  }
  decide(card,verdict,"");
}
function sendNote(card){
  var t=(view.notes[card]||"").trim();
  if(!t){ view.hint="「改」要寫一句意見，不然產線不知道改什麼。"; render(); return; }
  decide(card,"改",t);
}
function decide(card,verdict,note){
  var r=cardOf(card);
  if(!r){ closeCard(); toast("這張卡已被處理（"+card+"）","bad"); return; }
  var slug=r.channel;
  if(r.ambiguous){
    var s=document.getElementById("amb");
    slug=s?s.value:"";
    if(!slug){ view.hint="這張卡認不出頻道，請先選一個。"; render(); return; }
  }
  var action={kind:"decide",channel:slug,build:r.build||"",card:card,verdict:verdict,note:note};
  submit(card,action,card+" 裁「"+verdict+"」",function(){ decide(card,verdict,note); });
}
function relDone(card){
  var r=cardOf(card);
  if(!r){ closeCard(); toast("這張卡已被處理（"+card+"）","bad"); return; }
  submit(card,{kind:"related-done",channel:r.channel,build:r.build,card:card,verdict:"",note:""},
         card+" 已設好",function(){ relDone(card); });
}
/* 卡池擋下／解除（ER-142）：先彈窗確認 → 卡立刻換邊（樂觀）→ 結果走提示；
   送不出去就把樂觀值收回來，列表回到原樣。 */
function poolBlocked(slug,p){
  var v=view.poolOpt[slug+":"+p.tc];
  return v===undefined?!!p.blocked:v;
}
function poolToggle(slug,tc,un){
  view.poolOpt[slug+":"+tc]=!un; view.poolAsk=null; render();
  var label=(un?"解除擋下 ":"擋下 ")+tc;
  var tid=toast("已送出："+label,"wait");
  sendAction({kind:un?"pool-unblock":"pool-block",channel:slug,build:tc,card:"",verdict:"",note:""})
    .then(function(row){ waitAction(row.id,function(res){
      dropToast(tid); toast("已完成："+label+"（"+res+"）"); }); })
    .catch(function(e){
      delete view.poolOpt[slug+":"+tc];           // 沒送出去就不要假裝擋下了
      dropToast(tid); render();
      toast("送不出去："+(e.message||e),"bad",function(){ poolToggle(slug,tc,un); });
    });
}
function poolModal(){
  var a=view.poolAsk;
  if(!a) return "";
  return '<div class="doc" id="pbg"><div role="dialog" aria-modal="true" aria-label="卡池確認">'
    +'<div class="k-meta"><span>任務卡</span><span class="dim">・</span><span>'+esc(a.tc)+'</span>'
    +'<button class="g" id="px" style="margin-left:auto" aria-label="關閉">'+ico("x")+'關閉</button></div>'
    +'<div class="k-title">'+esc(a.title||a.tc)+'</div>'
    +'<div class="k-note">'+(a.un?"解除之後這張卡會回到可開工，行事曆排到它就會開工。"
                                 :"擋下之後這張卡不會開工，會收進「已擋下」，隨時可以解除。")+'</div>'
    +'<div class="acts"><button class="p" id="pok">'+(a.un?"確定解除擋下":"確定擋下這張")+'</button>'
    +'<button id="pno">取消</button></div></div></div>';
}

/* ---------- 起步 ---------- */
function start(){
  fetchSnap();
  clearInterval(timer);
  timer=setInterval(function(){ if(!document.hidden) fetchSnap(true); },60000);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) fetchSnap(true); });
  if(!start.keyed){                              // Esc 關彈窗（只掛一次）
    start.keyed=true;
    document.addEventListener("keydown",function(e){
      if(e.key!=="Escape") return;
      if(view.poolAsk){ view.poolAsk=null; render(); return; }
      if(view.card) closeCard();
    });
  }
}
(function(){
  var t=localStorage.getItem(LS+"-theme");
  if(t) document.documentElement.setAttribute("data-theme",t);
  cfg=loadCfg();
  if(!cfg){ renderSetup(); return; }
  tok=loadTok();
  if(!tok){ renderLogin(""); return; }
  refresh().then(start).catch(function(){ renderLogin("請重新登入"); });
})();
</script>
</body>
</html>
