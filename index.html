<!doctype html>
<html lang="zh-Hant" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>工廠看板</title>
<!--
  老闆看板前端（ER-134 起；ER-164 第三版：公司 → 頻道 → 單支片，三層各一屏）。
  單檔、零相依、零建置：推到公開 repo wern0531/ops-board，GitHub Pages 服務。
  紅線：這個檔**不含任何金鑰、資料、本機路徑**。專案網址與 publishable key 由 CEO 給的設定連結
  （#u=…&k=…）帶進來存 localStorage——片段不會送到任何伺服器，也不進 repo。
  沒登入什麼都拿不到：所有資料都要帶 Supabase 的登入 JWT 才讀得到（RLS 只開給 authenticated）。

  資訊三層，每層只回答一個問題，而且每層都只有一屏（主畫面不捲，放不下就分頁）：
    總覽＝「整間公司正常嗎、哪個頻道要我注意？」（四個指標＋一頻道一行的總表）
    頻道頁＝「這個頻道這週走到哪、成績如何？」（概況／選題池／所有片／成本明細）
    抽屜＝「這一支片怎麼了、要不要放行？」（不換頁，從總覽或頻道頁任一處點開）
  主選單四項：總覽／頻道／等你／成本。彈窗只留給「設相關影片」與卡池確認，其他一律抽屜或分頁。
  圖全部手畫 SVG，不載任何圖表庫。
  兩列快照：current（20 秒一輪，產線狀態）＋analytics（一天一次，趨勢與圖表）。
  ER-163：這個檔一改，常駐（看板伺服器）會自己推上線並重啟，不必有人去按。
-->
<style>
/* ER-164 色票：樣稿那一組（冷調、白卡、一個強調色）。深色色票留著（亮暗切換還在用），
   但版面只有一套——舊的「桌機一套、手機一套」與舊深色分頁樣式已刪。 */
:root{
  --bg:#f3f5f8; --card:#ffffff; --line:#e2e8f0; --soft:#f1f5f9;
  --ink:#0f172a; --dim:#475569; --dim2:#64748b; --mute:#cbd5e1;
  --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#eff4fe;
  --ok:#15803d; --warn:#b45309; --warn-soft:#fef3c7; --warn-ink:#92400e;
  --bad:#b42318; --series2:#94a3b8;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0e10; --card:#15171a; --line:#272a2f; --soft:#1d2024;
  --ink:#e9eaec; --dim:#9aa0a8; --dim2:#8b919a; --mute:#3a3f46;
  --accent:#8098f9; --accent-ink:#0d0e10; --accent-soft:#1b2033;
  --ok:#4cc38a; --warn:#d6a23d; --warn-soft:#2a2316; --warn-ink:#e3b55e;
  --bad:#ef6a60; --series2:#8b919a;
}}
html[data-theme=light]{--bg:#f3f5f8;--card:#ffffff;--line:#e2e8f0;--soft:#f1f5f9;
  --ink:#0f172a;--dim:#475569;--dim2:#64748b;--mute:#cbd5e1;
  --accent:#2563eb;--accent-ink:#ffffff;--accent-soft:#eff4fe;
  --ok:#15803d;--warn:#b45309;--warn-soft:#fef3c7;--warn-ink:#92400e;--bad:#b42318;--series2:#94a3b8}
html[data-theme=dark]{--bg:#0d0e10;--card:#15171a;--line:#272a2f;--soft:#1d2024;
  --ink:#e9eaec;--dim:#9aa0a8;--dim2:#8b919a;--mute:#3a3f46;
  --accent:#8098f9;--accent-ink:#0d0e10;--accent-soft:#1b2033;
  --ok:#4cc38a;--warn:#d6a23d;--warn-soft:#2a2316;--warn-ink:#e3b55e;--bad:#ef6a60;--series2:#8b919a}
*{box-sizing:border-box}
html,body{height:100%}
/* 一屏＝版面的骨架：主畫面永遠不捲，捲動只出現在抽屜裡面。 */
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.45 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
b,strong,.num,.big,td,th{font-variant-numeric:tabular-nums}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em}
h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
h3{font-size:14px;font-weight:700;margin:0}
.dim{color:var(--dim2);font-size:12px}
.big{font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gap{flex:1}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
/* 頂列（56px，固定）＋主選單 */
.top{flex:none;height:56px;display:flex;align-items:center;gap:20px;padding:0 24px;
  background:var(--card);border-bottom:1px solid var(--line)}
.top.red{border-bottom-color:var(--bad);box-shadow:inset 0 -2px 0 var(--bad)}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.menu{display:flex;gap:4px}
.menu button{border:0;background:transparent;color:var(--dim);font:inherit;padding:8px 14px;
  border-radius:8px;cursor:pointer;white-space:nowrap}
.menu button:hover{background:var(--soft)}
.menu button[aria-selected=true]{background:var(--ink);color:var(--bg);font-weight:500}
.cnt{font-size:12px;color:#fff;background:var(--warn);border-radius:999px;padding:0 7px;margin-left:4px}
.st{display:flex;align-items:center;gap:8px;color:var(--dim);white-space:nowrap}
.lite{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.lite.w{background:var(--warn)}.lite.b{background:var(--bad)}
/* 內容區 */
.wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:14px 24px 16px}
.g4{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
.card{padding:11px 15px;display:flex;align-items:center;gap:14px;min-height:62px}
.card .lab{color:var(--dim);font-size:12px}
.card .col{display:flex;flex-direction:column;min-width:0}
.card .xtra{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.main{flex:1;min-height:0;display:flex;gap:14px}
.panel{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;border-radius:14px}
.ph{display:flex;align-items:baseline;gap:10px;padding:12px 18px 8px;flex:none}
.pb{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:0 18px 12px}
.pf{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--dim2)}
.side{width:340px;flex:none;display:flex;flex-direction:column;gap:14px;min-height:0}
.side .panel{flex:none}
.side .panel.grow{flex:1}
.pgr{display:flex;align-items:center;gap:4px;margin-left:auto}
.pgr button{min-height:26px;padding:2px 9px}
/* 頻道總表 */
.thead,.chr{display:grid;gap:12px;align-items:center;
  grid-template-columns:200px 80px minmax(80px,1fr) 150px 56px 96px 86px 12px}
.thead{padding:7px 18px;font-size:12px;color:var(--dim2);border-top:1px solid var(--soft);
  border-bottom:1px solid var(--line);flex:none}
.chr{height:54px;padding:0 18px;border-bottom:1px solid var(--soft);text-decoration:none;
  color:var(--ink);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;
  font:inherit;text-align:left;width:100%}
.chr:hover{background:var(--soft)}
.chr.warn{background:#fffbeb}
html[data-theme=dark] .chr.warn,@media (prefers-color-scheme:dark){.chr.warn{background:var(--warn-soft)}}
.chr .nm{display:flex;align-items:center;gap:9px;min-width:0}
.chr .nm b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chr.off{color:var(--dim2)}
.sub{display:none}
.pill{font-size:11px;font-weight:500;padding:1px 8px;border-radius:999px;white-space:nowrap;
  color:var(--dim);background:var(--soft);flex:none}
.pill.w{color:var(--warn-ink);background:var(--warn-soft)}
.pill.o{color:var(--ok);background:var(--soft)}
.pill.b{color:#fff;background:var(--bad)}
.dots{display:flex;gap:4px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mute);box-sizing:border-box;
  flex:none}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots i.wait{border-color:var(--accent)}
.trk{display:grid;gap:3px}
.trk i{height:18px;border-radius:4px;background:var(--soft);color:var(--dim2);font-size:11px;
  font-weight:700;font-style:normal;display:flex;align-items:center;justify-content:center}
.trk i.on{background:var(--accent);color:var(--accent-ink)}
.v7{display:flex;align-items:center;gap:7px}
.v7 .num{font-weight:600;width:46px}
.spark{width:58px;height:20px;flex:none}
.bc{position:relative;height:6px;background:var(--soft);border-radius:999px;flex:1;min-width:40px}
.bc i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bc i.g{background:var(--ok)}.bc i.r{background:var(--bad)}
.bc u{position:absolute;top:-4px;width:2px;height:14px;background:var(--dim);text-decoration:none}
.cost{display:flex;align-items:center;gap:6px}
/* 等你／提醒 */
.ask{display:flex;flex-direction:column;gap:8px;padding:9px;border:1px solid var(--line);
  border-radius:10px}
.ask .hd{display:flex;gap:10px;min-width:0}
.ask .tt{font-weight:700;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.ask .acts{display:flex;gap:8px}
.ask .acts button{flex:1;min-height:34px;justify-content:center}
.thumb{width:96px;height:54px;flex:none;border-radius:6px;background:var(--soft);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--dim2);font-size:11px;object-fit:cover}
.note{display:flex;gap:10px;align-items:flex-start}
.note u{flex:none;margin-top:6px;width:8px;height:8px;border-radius:50%;text-decoration:none}
.note b{font-weight:500;font-size:13px;display:block}
/* 頻道頁 */
.chtop{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);min-width:0}
.crumb button{border:0;background:transparent;color:var(--dim);font:inherit;cursor:pointer;padding:0}
.crumb button:hover{color:var(--accent)}
.segs{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.segs button{border:0;border-radius:8px;padding:5px 13px;background:transparent;color:var(--dim);
  font:inherit;font-size:13px;cursor:pointer;min-height:30px}
.segs button[aria-selected=true]{background:var(--card);color:var(--ink);font-weight:500;
  box-shadow:0 1px 2px rgba(15,23,42,.08)}
.nn{display:flex;align-items:center;gap:2px}
.nn button{width:32px;height:32px;justify-content:center;padding:0}
.c3{flex:1;min-height:0;display:grid;grid-template-columns:380px minmax(0,1fr) 300px;gap:14px}
.panes{display:none}
.stg{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.stg .r{display:flex;gap:10px;align-items:flex-start}
.stg .r>.lb{flex:none;width:52px;display:flex;align-items:center;gap:7px;padding-top:5px;
  font-size:12px;color:var(--dim2)}
.stg .r>.lb u{width:7px;height:7px;border-radius:50%;background:var(--mute);text-decoration:none;flex:none}
.stg .r.on>.lb{color:var(--ink)}
.stg .r.on>.lb u{background:var(--accent)}
.stg .bx{flex:1;min-width:0;min-height:26px;display:flex;flex-direction:column;gap:6px;
  border-left:2px solid var(--soft);padding-left:10px}
.film{display:flex;gap:9px;align-items:center;padding:7px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);cursor:pointer;font:inherit;color:var(--ink);text-align:left;
  width:100%}
.film:hover{background:var(--soft)}
.film.w{border-color:#fcd34d;background:#fffbeb}
html[data-theme=dark] .film.w{border-color:var(--warn);background:var(--warn-soft)}
.film .th{width:64px;height:36px;flex:none;border-radius:5px;object-fit:cover;background:var(--soft);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  color:var(--dim2);font-size:10px}
.film .tt{font-weight:700;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:2px;height:122px;border-bottom:1px solid var(--line);flex:none}
.bars i{flex:1 1 0;display:block;min-height:3px;border-radius:2px 2px 0 0;background:var(--accent);
  opacity:.45}
.bars i.pub{opacity:1}
.bars i.none{opacity:1;height:12%;
  background:repeating-linear-gradient(135deg,var(--mute) 0 3px,transparent 3px 6px)}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 180px 52px;gap:12px;align-items:center;
  height:40px;border-bottom:1px solid var(--soft);cursor:pointer;background:transparent;border-left:0;
  border-right:0;border-top:0;font:inherit;color:var(--ink);text-align:left;padding:0;width:100%}
.vrow:hover{background:var(--soft)}
.vrow .num{text-align:right;font-weight:700}
.rows{flex:1;min-height:0;display:flex;flex-direction:column}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--soft);
  min-width:0}
.row:last-child{border-bottom:0}
.t3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.t3>div{background:var(--soft);border-radius:10px;padding:8px 11px}
.t3 b{display:block;font-size:17px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--soft);padding:6px 8px;text-align:left;white-space:nowrap}
th{color:var(--dim2);font-weight:500}
/* 抽屜＝單支片（不換頁） */
.dwbg{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:19}
.dw{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;z-index:20;background:var(--card);
  border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(15,23,42,.1);display:flex;
  flex-direction:column}
.dwh{flex:none;display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;
  border-bottom:1px solid var(--line)}
.dwb{flex:1;min-height:0;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:16px}
.dwf{flex:none;padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;
  flex-direction:column;gap:8px}
.dwf .r{display:flex;gap:8px}
.dwf button{flex:1;min-height:42px;justify-content:center}
.dwf button.p{flex:2}
.sec{display:flex;flex-direction:column;gap:8px}
.sec .hd{display:flex;align-items:baseline;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick{aspect-ratio:16/9;border-radius:8px;border:1px solid var(--line);background:var(--soft);
  padding:0;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;
  color:var(--dim2);font-size:11px}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.pick[aria-pressed=true]{border:3px solid var(--accent)}
.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.steps>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.steps i{height:6px;border-radius:3px;background:var(--soft);display:block}
.steps i.on{background:var(--accent)}
.steps i.now{background:var(--warn)}
.steps em{font-size:11px;font-style:normal;color:var(--dim)}
.steps span{font-size:11px;color:var(--dim2)}
.lines{display:flex;flex-direction:column;gap:6px}
.lines>div{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--soft);
  border-radius:10px;font-size:13px}
.lines u{width:8px;height:8px;border-radius:50%;text-decoration:none;flex:none}
/* 按鈕與輸入 */
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--mute);
  background:var(--card);color:var(--ink);padding:6px 12px;min-height:32px;display:inline-flex;
  align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
button:hover,.btn:hover{background:var(--soft)}
button.p,.btn.p{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
button.p:hover{filter:brightness(1.15)}
button.g{border-color:transparent;background:transparent;color:var(--dim)}
button.g:hover{background:var(--soft);color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
.ico{width:14px;height:14px;flex:0 0 14px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;width:100%;min-height:36px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:64px;resize:vertical}
.hint{color:var(--bad);font-size:12px}
.chip{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
svg{display:block;width:100%;height:auto}
.stat{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim2)}
/* 彈窗只剩兩個：設相關影片、卡池確認 */
.doc{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;
  justify-content:center;z-index:22;padding:12px}
.doc>div{background:var(--card);width:100%;max-width:560px;max-height:84vh;overflow:auto;
  border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.6 ui-monospace,"Noto Sans TC",monospace;margin:0}
.login{max-width:330px;margin:14vh auto;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.err{color:var(--bad);font-size:13px;word-break:break-word}
.toasts{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;gap:8px;
  max-width:330px}
.toast{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;
  font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 16px rgba(15,23,42,.1)}
.toast.bad{border-color:var(--bad)}
.toast .x{margin-left:auto}
.spin{width:13px;height:13px;flex:0 0 13px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.busy{opacity:.5}
.navb{display:none;flex:none;height:58px;border-top:1px solid var(--line);background:var(--card)}
.navb button{flex:1;border:0;background:transparent;color:var(--dim);min-height:58px;
  justify-content:center;font-size:13px;border-radius:0}
.navb button[aria-selected=true]{color:var(--ink);font-weight:700}
.mob{display:none}
/* 1180 以下先讓出訂閱與花費兩欄（它們在頻道頁看得到），總表不擠 */
@media (max-width:1180px){
  .thead,.chr{grid-template-columns:180px 76px minmax(70px,1fr) 136px 84px 12px}
  .c-subs,.c-cost{display:none}
  .c3{grid-template-columns:330px minmax(0,1fr) 270px}
}
/* 375～820：一屏靠換頁，不靠縮小。右欄、桌機選單收起；頻道頁概況三欄變三頁。 */
@media (max-width:820px){
  .desk{display:none!important}
  .mob{display:flex}
  .navb{display:flex}
  .wrap{padding:10px 12px 10px;gap:10px}
  .g4{gap:6px}
  .g4 .card{min-height:0;padding:8px 6px;flex-direction:column;gap:2px;align-items:center;
    text-align:center}
  .g4 .xtra,.g4 .lab2{display:none}
  .g4 .big{font-size:17px}
  .g4 .lab{font-size:11px}
  .thead{display:none}
  .chr{grid-template-columns:10px minmax(0,1fr) auto 52px 10px;height:52px;padding:0 14px;gap:9px}
  .c-track,.c-subs,.c-cost,.c-next{display:none}

<body>
<div id="app"></div>
<script>
"use strict";
var LS="aicc-board";
var cfg=null, tok=null, snap=null, ana=null, at="", anaAt="", timer=null;
/* ER-140：view.card 是**卡號**（不是 snap.inbox 的索引——自動重讀後索引會指到別張卡）。
   notes＝使用者正在寫的「改」意見（重畫不掉）；busy＝已送出等落地的卡號；
   confirm＝「放行」的第二段確認；toasts＝右下角提示（取代 alert／confirm）。
   ER-142：poolOpt＝卡池「擋下／解除」的樂觀覆蓋；poolAsk＝擋下／解除的確認彈窗。
   ER-164：tab＝四個主分頁；ch＝頻道頁現在看哪個頻道（不再是全域濾鏡）；chTab＝頻道內小分頁；
   pane＝手機版概況看第幾欄；film＝抽屜開著哪一支片；thumb＝抽屜裡選的縮圖；pg＝各清單的頁碼。 */
var view={tab:"home", ch:"", chTab:"over", pane:0, film:null, thumb:"", pg:{},
          card:null, doc:null, err:"",
          notes:{}, busy:{}, confirm:"", hint:"", noteOpen:"", toasts:[],
          poolOpt:{}, poolAsk:null};
var toastSeq=0, deferred=false;
var TABS=[["home","總覽"],["ch","頻道"],["inbox","等你"],["cost","成本"]];
var CHTABS=[["over","概況"],["pool","選題池"],["all","所有片"],["cost","成本明細"]];
/* 七段的名字（部門→人話，四字以內才在 375 寬放得下）；順序由後端讀產線宣告給，不寫死。 */
var DEPT_ZH={"研究":"選題","腳本":"腳本","配音":"配音","視覺":"畫面","剪輯":"合成",
             "品檢發布":"審片","CEO室":"待放行"};
var PER={ch:10, ask:6, note:6, vid:8, pool:6};

/* ---------- 設定（專案網址＋publishable key）：只從設定連結或 localStorage 來 ---------- */
function readFragment(){
  var h=location.hash.replace(/^#/,""); if(!h) return null;
  var p=new URLSearchParams(h), u=p.get("u"), k=p.get("k");
  if(!u||!k) return null;
  var c={url:u.replace(/\/+$/,""),key:k};
  localStorage.setItem(LS+"-cfg",JSON.stringify(c));
  history.replaceState(null,"",location.pathname+location.search);   // 片段不留在網址列
  return c;
}
function loadCfg(){
  return readFragment()||JSON.parse(localStorage.getItem(LS+"-cfg")||"null");
}
function loadTok(){ return JSON.parse(localStorage.getItem(LS+"-tok")||"null"); }
function saveTok(t){ tok=t; t?localStorage.setItem(LS+"-tok",JSON.stringify(t)):localStorage.removeItem(LS+"-tok"); }

/* ---------- Supabase（手寫 fetch，不載任何第三方 SDK） ---------- */
function api(path,opt){
  opt=opt||{};
  var h={apikey:cfg.key,"Content-Type":"application/json"};
  if(tok&&tok.access_token) h.Authorization="Bearer "+tok.access_token;
  Object.keys(opt.headers||{}).forEach(function(k){h[k]=opt.headers[k];});
  return fetch(cfg.url+path,{method:opt.method||"GET",headers:h,
    body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){
    return r.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){ j=t; }
      return {ok:r.ok,status:r.status,data:j};
    });
  });
}
function login(email,pw){
  return api("/auth/v1/token?grant_type=password",{method:"POST",body:{email:email,password:pw}})
    .then(function(r){
      if(!r.ok) throw new Error((r.data&&(r.data.error_description||r.data.msg||r.data.error))||("登入失敗 "+r.status));
      saveTok(r.data); return r.data;
    });
}
function refresh(){
  if(!tok||!tok.refresh_token) return Promise.reject(new Error("沒有登入"));
  return api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:{refresh_token:tok.refresh_token}})
    .then(function(r){ if(!r.ok) throw new Error("登入過期"); saveTok(r.data); return r.data; });
}
function authed(path,opt){                       // 401 先換一次 token，再失敗才真的登出
  return api(path,opt).then(function(r){
    if(r.status!==401) return r;
    return refresh().then(function(){ return api(path,opt); });
  });
}
function fetchSnap(auto){                        // 兩列一次拿：current（產線）＋analytics（圖表）
  return authed("/rest/v1/board_snapshot?key=in.(current,analytics)&select=key,at,data")
    .then(function(r){
    if(!r.ok) throw new Error("讀不到資料（"+r.status+"）");
    if(!r.data||!r.data.length) throw new Error("還沒有快照（本機還沒推第一輪）");
    r.data.forEach(function(row){
      if(row.key==="analytics"){ ana=row.data; anaAt=row.at; }
      else { snap=row.data; at=row.at; }
    });
    if(!snap) throw new Error("只有分析資料，還沒有產線快照");
    view.err=""; afterSnap(auto);
  }).catch(function(e){ view.err=e.message||String(e); render(auto); });
}
/* 重讀之後：開著的彈窗那張卡、抽屜那支片不在了就關掉並說一聲（絕不改成指到別張）。 */
function afterSnap(auto){
  /* 卡池：本機那一輪已經把擋下落地（快照跟樂觀值一致）→ 覆蓋清掉，回歸快照為準 */
  (snap.channels||[]).forEach(function(c){
    (c.pool||[]).forEach(function(p){
      var k=c.slug+":"+p.tc;
      if(view.poolOpt[k]!==undefined&&view.poolOpt[k]===!!p.blocked) delete view.poolOpt[k];
    });
  });
  if(view.card&&!cardOf(view.card)){
    var gone=view.card;
    view.card=null; view.confirm=""; view.hint=""; lockScroll(false);
    delete view.notes[gone];
    if(!view.busy[gone]) toast("這張卡已被處理（"+gone+"），彈窗已關閉","bad");
    render(); return;
  }
  if(view.film&&!filmOf(view.film)){
    view.film=null; view.thumb=""; view.confirm="";
  }
  render(auto);
}
function cardOf(id){
  var rows=(snap&&snap.inbox)||[];
  for(var i=0;i<rows.length;i++) if(rows[i].card===id) return rows[i];
  return null;
}
/* ---------- 提示（取代 alert／confirm；桌機右下、手機底部） ---------- */
function toast(text,kind,retry){
  var t={id:++toastSeq,text:text,kind:kind||"",retry:retry||null};
  view.toasts.push(t);
  if(kind!=="bad") setTimeout(function(){ dropToast(t.id); },4500);
  renderToasts(); return t.id;
}
function dropToast(id){
  view.toasts=view.toasts.filter(function(t){ return t.id!==id; });
  renderToasts();
}
function toastsHtml(){
  return '<div class="toasts" id="toasts">'+view.toasts.map(function(t){
    return '<div class="toast'+(t.kind?" "+t.kind:"")+'">'
      +(t.kind==="wait"?'<span class="spin"></span>':"")+'<span>'+esc(t.text)+'</span>'
      +(t.retry?'<button class="g" data-retry="'+t.id+'">重試</button>':"")
      +'<button class="g x" data-tdrop="'+t.id+'" aria-label="關閉提示">'+ico("x")+'</button></div>';
  }).join("")+'</div>';
}
function renderToasts(){                         // 只換提示那一塊，不整頁重畫
  var host=document.getElementById("toasts");
  if(!host){ render(); return; }
  host.outerHTML=toastsHtml();
  wireToasts();
}
function sendAction(a){
  return authed("/rest/v1/board_actions",{method:"POST",body:[a],
    headers:{Prefer:"return=representation"}}).then(function(r){
    if(!r.ok) throw new Error((r.data&&(r.data.message||r.data.hint))||("送不出去 "+r.status));
    return r.data[0];
  });
}
function waitAction(id,cb){                      // 等本機那一輪把它落地（applied_at 回填）
  var n=0;
  var iv=setInterval(function(){
    n++;
    authed("/rest/v1/board_actions?id=eq."+id+"&select=applied_at,result").then(function(r){
      var row=r.ok&&r.data&&r.data[0];
      if(row&&row.applied_at){ clearInterval(iv); cb(row.result||"已落地",true); fetchSnap(); }
      else if(n>40){ clearInterval(iv); cb("本機還沒收到（下一輪會處理）",false); }
    });
  },5000);
}

/* ---------- 送出一個動作：關掉抽屜與彈窗＋那張卡變處理中＋提示 ----------
   三處「等你」（總覽右欄、頻道頁右欄、抽屜）都是從同一份 snap.inbox 與 view.busy 現算的，
   所以按一處＝render() 一次＝三處同時變「處理中…」，落地後三處一起消失。 */
function submit(card,action,label,again){
  view.busy[card]=true;
  view.film=null; view.thumb="";
  closeCard();
  var tid=toast("已送出："+label,"wait");
  return sendAction(action).then(function(row){
    waitAction(row.id,function(res){
      dropToast(tid); delete view.busy[card];
      toast("已完成："+res); render();
    });
  }).catch(function(e){
    dropToast(tid); delete view.busy[card];
    toast("送不出去："+(e.message||e),"bad",again||null);
    render();
  });
}

/* ---------- 小工具 ---------- */
var ICONS={
  x:'<path d="M4 4l8 8M12 4l-8 8"/>',
  doc:'<path d="M9.3 2H4.7a1 1 0 00-1 1v10a1 1 0 001 1h6.6a1 1 0 001-1V5.2z"/><path d="M9.3 2v3.2h3"/>',
  theme:'<circle cx="8" cy="8" r="5.4"/><path d="M8 2.6a5.4 5.4 0 010 10.8z" fill="currentColor" stroke="none"/>',
  out:'<path d="M10.5 11l3-3-3-3M13.5 8H6.5M6.5 2.6H3v10.8h3.5"/>',
  left:'<path d="M9.5 4L5.5 8l4 4"/>'
};
function ico(name){
  return '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false">'
    +(ICONS[name]||"")+'</svg>';
}
function lockScroll(on){ if(document.body) document.body.className=on?"lock":""; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function dimv(v,txt){ return (v===null||v===undefined||v==="")?'<span class="dim">'+(txt||"量不到")+'</span>':null; }
function fmt(n){
  if(n===null||n===undefined||n==="") return "—";
  var x=Math.round(Number(n)*10)/10;
  return String(x).replace(/\B(?=(\d{3})+(?!\d))/g,",");
}
function ago(s){
  var t=Date.parse(String(s||"").replace(" ","T")); if(!t) return "";
  var m=Math.round((Date.now()-t)/60000);
  return m<1?"剛剛":(m<60?m+" 分前":Math.floor(m/60)+" 小時前");
}
function hhmm(s){ var m=String(s||"").match(/(\d{2}):(\d{2})/); return m?m[1]+":"+m[2]:"—"; }
function md(s){ return String(s||"").slice(5).replace("-","/"); }   // 2026-10-30 → 10/30
function today(){ return String(at||"").slice(0,10); }
function ch(slug){ return (snap.channels||[]).filter(function(c){return c.slug===slug;})[0]||null; }
function pushedAgo(){ var t=Date.parse(at||""); return t?Math.round((Date.now()-t)/1000):null; }
function anaOf(slug){
  return ((ana&&ana.channels)||[]).filter(function(x){ return x.slug===slug; })[0]||null;
}
function anaChs(slug){
  var cs=(ana&&ana.channels)||[];
  return slug?cs.filter(function(c){return c.slug===slug;}):cs;
}
function allVideos(slug){
  var out=[];
  anaChs(slug).forEach(function(c){ (c.videos||[]).forEach(function(v){
    out.push(Object.assign({channel:c.slug,color:c.color},v)); }); });
  return out;
}
function vidOf(id){ return allVideos().filter(function(v){return v.video_id===id||v.tc===id;})[0]||null; }
/* ER-161：近 7 天觀看只算到報表完整那天，報表未到的日子是「未到」不是 0。
   任何一台算不出完整的 7 天就整個回 null（顯示「量不到」，不給假的漲跌）。 */
function views7(key,slug){
  var cs=anaChs(slug), t=0, got=false;
  for(var i=0;i<cs.length;i++){
    var v=cs[i][key];
    if(v==null) return null;
    t+=v; got=true;
  }
  return got?t:null;
}
function reportThrough(){                        // 報表到哪天（多台取最舊的那天，才不會高估）
  var cs=anaChs(), out="";
  for(var i=0;i<cs.length;i++){
    var d=cs[i].report_through||"";
    if(!d) return "";
    if(!out||d<out) out=d;
  }
  return out;
}
function totalViews(slug){                       // 累計觀看＝各台 Data API statistics.viewCount
  var cs=anaChs(slug), t=0, got=false;
  for(var i=0;i<cs.length;i++){
    var v=(cs[i].live||{}).total_views;
    if(v==null) continue;
    t+=v; got=true;
  }
  return got?t:null;
}
function dailyTot(slug){                         // 逐日觀看（長＋短），報表未到的日子是 null
  var d=[];
  anaChs(slug).forEach(function(c){ (c.daily||[]).forEach(function(x,i){
    d[i]=x.pending?null:((d[i]||0)+(x.long||0)+(x.short||0)); }); });
  return d;
}
function latestSnap(v){                          // 一支片最後一格有資料的快照
  var got=null;
  ["48h","7d","28d"].forEach(function(k){
    var s=(v.snaps||{})[k];
    if(s&&(s.views!=null||s.avp!=null)) got=Object.assign({key:k},s);
  });
  return got;
}
function plain(s){            // 洗掉反引號段（都是檔案路徑）、粗體、內部單號、路徑
  return String(s==null?"":s)
    .replace(/`[^`]*`/g,"").replace(/\*\*/g,"")
    .replace(/(?:ER|BE|W|D)-\d+[A-Za-z0-9-]*/g,"")
    .replace(/[A-Za-z0-9_.-]+\/[A-Za-z0-9_./-]+/g,"")
    .replace(/[（(]\s*[）)]/g,"").replace(/／{2,}/g,"／").replace(/\s{2,}/g," ")
    .replace(/^[\s、，。：；／]+|[\s、，。：；／]+$/g,"");
}
function dayDiff(a,b){
  var x=Date.parse(String(a||"").replace(" ","T")), y=Date.parse(String(b||"").replace(" ","T"));
  return (x&&y)?Math.round((y-x)/86400000):null;
}

/* ---------- 手畫 SVG（不載圖表庫） ---------- */
function niceMax(v){
  if(!v||v<=0) return 1;
  var p=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)), n=v/p;
  return p*(n<=1?1:n<=2?2:n<=5?5:10);
}
function svgLines(labels,series,marks,h,xf){
  h=h||260; xf=xf||function(s){ return s; };
  var W=1000, L=48, R=12, T=14, B=26;
  var max=1;
  series.forEach(function(s){ (s.pts||[]).forEach(function(v){ if(v>max) max=v; }); });
  max=niceMax(max);
  var n=labels.length, iw=W-L-R, ih=h-T-B;
  var X=function(i){ return L+(n<2?iw/2:iw*i/(n-1)); };
  var Y=function(v){ return T+ih-ih*(Number(v||0)/max); };
  var g="";
  for(var k=0;k<=4;k++){
    var val=max*k/4, y=Y(val);
    g+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="currentColor" stroke-opacity=".16"/>'
      +'<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="currentColor" fill-opacity=".55">'
      +fmt(val)+'</text>';
  }
  [0,Math.floor((n-1)/2),n-1].forEach(function(i,j){
    if(i<0||!labels[i]) return;
    g+='<text x="'+X(i)+'" y="'+(h-7)+'" text-anchor="'+(j===0?"start":j===2?"end":"middle")
      +'" font-size="12" fill="currentColor" fill-opacity=".55">'+esc(xf(String(labels[i])))+'</text>';
  });
  (marks||[]).forEach(function(m){
    if(m.i<0||m.i>=n) return;
    g+='<line x1="'+X(m.i)+'" y1="'+T+'" x2="'+X(m.i)+'" y2="'+(h-B)+'" stroke="'+(m.color||"currentColor")
      +'" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity=".7"><title>'+esc(m.label||"")+'</title></line>';
  });
  series.forEach(function(s){
    var pts=s.pts||[]; if(!pts.length) return;
    var d=pts.map(function(v,i){ return (i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1); }).join(" ");
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" stroke-linejoin="round"/>';
  });
  return '<svg viewBox="0 0 '+W+' '+h+'" role="img">'+g+'</svg>';
}
function legend(series){
  return '<div class="stat">'+series.map(function(s){
    return '<span><span class="chip" style="background:'+s.color+'"></span>'+esc(s.name)+'</span>';
  }).join("")+'</div>';
}
function spark(pts,color){
  pts=(pts||[]).filter(function(v){return v!=null;});
  if(pts.length<2) return '';
  var W=112,H=26,max=Math.max.apply(null,pts)||1,min=Math.min.apply(null,pts);
  var rng=(max-min)||1;
  var d=pts.map(function(v,i){
    return (i?"L":"M")+(i*(W-2)/(pts.length-1)+1).toFixed(1)+" "+(H-1-(v-min)/rng*(H-3)).toFixed(1);
  }).join(" ");
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" '
    +'aria-label="觀看趨勢"><path d="'+d+'" fill="none" stroke="'+(color||"var(--accent)")
    +'" stroke-width="1.8"/></svg>';
}
function bc(pct,cls,mark){                        // 一根進度條（可帶刻線＝預測）
  var w=pct==null?0:Math.min(100,Math.max(2,pct));
  return '<span class="bc"><i class="'+(cls||"")+'" style="width:'+w.toFixed(0)+'%"></i>'
    +(mark!=null?'<u style="left:'+Math.min(100,Math.max(0,mark)).toFixed(0)+'%"></u>':'')+'</span>';
}
function barCell(v,max,pred,suf){                 // 表格裡的一根條＋刻線（刻線＝阿題預測）
  if(v==null) return '<td class="dim">量不到</td>';
  return '<td><div style="display:flex;align-items:center;gap:6px">'
    +bc(100*v/(max||1),"",pred!=null&&max?100*pred/max:null)
    +'<span class="dim">'+fmt(v)+(suf||"")+'</span></div></td>';
}
function delta(now,prev){
  if(now==null||prev==null||!prev) return "";
  var p=(now-prev)/Math.abs(prev)*100;
  var cls=p>1?"ok":(p<-1?"bad":"dim"), mark=p>1?"▲":(p<-1?"▼":"＝");
  return '<span class="'+cls+'" style="font-size:12px">'+mark+Math.abs(p).toFixed(0)+'%</span>';
}

/* ---------- 分頁器：清單一律分頁，主畫面不捲 ---------- */
function pages(n,per){ return Math.max(1,Math.ceil(n/per)); }
function pgAt(k,n,per){
  var p=view.pg[k]||0, m=pages(n,per)-1;
  return p>m?m:(p<0?0:p);
}
function slicePg(k,list,per){ var p=pgAt(k,list.length,per); return list.slice(p*per,p*per+per); }
function pager(k,n,per,unit){
  var ps=pages(n,per);
  if(ps<2) return '<span class="dim">'+fmt(n)+' '+(unit||"件")+'</span>';
  var p=pgAt(k,n,per);
  return '<span class="pgr"><span class="dim">'+fmt(n)+' '+(unit||"件")+'</span>'
    +'<button class="g" data-pg="'+k+'|-1"'+(p<=0?' disabled':'')+' aria-label="上一頁">‹</button>'
    +'<span class="num dim">'+(p+1)+' / '+ps+'</span>'
    +'<button class="g" data-pg="'+k+'|1"'+(p>=ps-1?' disabled':'')+' aria-label="下一頁">›</button></span>';
}

/* ---------- 登入／設定 ---------- */
function renderLogin(msg){
  document.getElementById("app").innerHTML=
   '<div class="login"><h1>工廠看板</h1>'
   +'<div class="dim">要老闆的帳號密碼。沒登入看不到任何資料。</div>'

             :(st.stale?(st.why||"資料過期"):"");

/* ---------- 總覽：四個指標＋一頻道一行的總表＋右欄等你／提醒 ---------- */
function openedChs(){
  return (snap.channels||[]).filter(function(c){ return c.opened!==false; });
}
function readyCards(slug){
  return inbox(slug).filter(function(r){ return r.kind==="decide"&&r.gate_open; }).length;
}
function dots(done,wait,target){
  var n=Math.max(Number(target)||0,done+wait,1), s="";
  for(var i=0;i<n&&i<6;i++) s+='<i class="'+(i<done?"on":(i<done+wait?"wait":""))+'"></i>';
  return '<span class="dots" aria-label="本週做好 '+done+' 支、'+wait+' 支等你">'+s+'</span>';

function mWeek(){
  var chs=openedChs();

  var target=chs.reduce(function(a,c){return a+(Number(c.weekly_target)||0);},0);
  var wait=readyCards("");
  return '<div class="card"><div class="col"><span class="lab">本週出片</span>'
    +'<span class="big">'+fmt(done)+'<span class="dim" style="font-size:14px"> / '
    +(target||"？")+'</span></span></div>'
    +'<div class="xtra">'+dots(done,wait,target)
    +'<span class="dim lab2">'+(wait?wait+" 支做好等你放行":"沒有等著放行的片")+'</span></div></div>';

function mViews(){
  var v7=views7("views_7d"), p7=views7("views_prev7"), th=reportThrough();

    +delta(v7,p7)+'</span></div>'
    +'<div class="xtra">'+spark(dailyTot(""))

    +'</span></div></div>';
}
function mSubs(){
  var cs=anaChs(), subs=null, dl=null;
  cs.forEach(function(c){
    var l=c.live||{};
    if(l.subs!=null) subs=(subs||0)+l.subs;
    if(l.subs_delta_7d!=null) dl=(dl||0)+l.subs_delta_7d;
  });
  var ms=[100,1000,10000,100000,1000000].filter(function(x){return subs==null||x>subs;})[0]||1000000;
  var pct=subs==null?null:Math.min(100,subs/ms*100);

    +(dl==null?"量不到":((dl>=0?"＋":"－")+fmt(Math.abs(dl))))+'</span></span></div>'
    +'<div class="xtra"><span style="display:flex">'+bc(pct)+'</span>'

function mCost(){
  var r=snap.resources||{}, q=r.quota||{}, cash=r.cash||{};

    return '<div style="display:flex;align-items:center;gap:8px;font-size:12px">'
      +'<span class="dim" style="width:56px">'+name+'</span>'+bc(pct,cls)

    +line("外部現金",(cash.week!=null&&cash.cap?cash.week/cash.cap*100:null),
          (cash.week==null?"—":"$"+fmt(cash.week)+(cash.cap?"/"+fmt(cash.cap):"")),over?"r":"g")
    +'</div>';

/* 需要注意的排最前面：卡住 → 有片等你 → 在跑 → 沒開線。 */
function attn(c){
  if(c.stuck) return 0;
  if(c.waiting) return 1;
  if(c.opened===false) return 4;
  return (c.active?2:3);
}
function chPill(c){
  if(c.stuck) return ['b',"有片卡住"];
  if(c.waiting) return ['w',c.waiting+" 支等你"];
  if(c.opened===false) return ['',"籌備中"];
  return ['o',"運作中"];
}
function stageAt(b,ds){                 // 片現在在第幾段：在動的站優先，都沒有就看做完的最後一站
  var sts=b.stations||[], pick=null;
  ["running","awaiting_boss","awaiting_ceo","failed","blocked"].forEach(function(st){
    if(!pick) sts.forEach(function(s){ if(!pick&&s.status===st) pick=s; });
  });
  if(!pick) sts.forEach(function(s){ if(/^completed/.test(String(s.status||""))) pick=s; });
  var i=pick?ds.indexOf(pick.dept||""):-1;
  return i<0?0:i;
}
function depts(c){ return (c.depts&&c.depts.length)?c.depts:Object.keys(DEPT_ZH); }
function track(c){
  var ds=depts(c), cnt=ds.map(function(){ return 0; });
  (c.builds||[]).forEach(function(b){
    var i=stageAt(b,ds);
    if(i>=0&&i<cnt.length) cnt[i]++;
  });
  return '<span class="trk" style="grid-template-columns:repeat('+ds.length
    +',minmax(0,1fr))">'+ds.map(function(d,i){
      return '<i class="'+(cnt[i]?"on":"")+'" title="'+esc(DEPT_ZH[d]||d)+'：'+cnt[i]+' 支">'
        +(cnt[i]||"")+'</i>';
    }).join("")+'</span>';
}
function nextPub(slug){
  var cells=((snap.calendar||{}).cells)||[], t=today();
  for(var i=0;i<cells.length;i++){
    var x=cells[i];
    if(x.d<t) continue;
    if((x.items||[]).some(function(it){ return it.channel===slug; }))
      return md(x.d)+" 週"+(x.wd||"");
  }
  return "未排";
}

function notes(slug){
  var ns=[], why=staleWhy(), h=snap.health||{}, r=snap.resources||{}, cs=anaChs(slug);
  var q=((snap.line_now||{}).queue||[]).filter(function(x){ return !slug||x.channel===slug; });

                   "最後一次更新 "+hhmm(at)+"，比平常久；產線本身不受影響"]);
  if(h.halted) ns.push(["var(--bad)","全廠停工中","排程器停著，要人去開起來"]);
  var pend=0;
  if(cs.length) (cs[0].daily||[]).forEach(function(x){ pend=x.pending?pend+1:0; });
  if(pend) ns.push(["var(--series2)","最近 "+pend+" 天的觀看數還沒進來",
                    "報表固定晚 2～3 天，不是掉量"]);
  var gpu=q.filter(function(x){ return x.kind==="gpu"; }).length;

                   (r.gpu||{}).next_open?"下次開 "+(r.gpu||{}).next_open:"時窗現在沒開"]);
  var left=(slug?[ch(slug)].filter(Boolean):openedChs()).filter(function(c){ return c.opened!==false; })
    .reduce(function(a,c){ return a+Math.max(0,(Number(c.weekly_target)||0)-(c.done_week||0)); },0);

    if(slug&&c.slug!==slug) return;
    (c.alerts||[]).forEach(function(a){

function curCh(){ return (snap.channels||[])[chIdx()]||null; }
function filmTitle(c,b){

function filmState(b){                             // 這支片現在停在哪、怎麼了（白話）

  if(/^v:/.test(p[1])){
    var id=p[1].slice(2), v=vidOf(id);
    var pv=pubVideos(c).filter(function(x){ return x.vid===id; })[0];

  }
  var b=(c.builds||[]).filter(function(x){ return x.build===p[1]; })[0];
  if(!b) return null;

  else if(sel!==pick) foot='<div class="dwf"><div class="r">'
    +'<button data-act="'+esc(card.card)+'|不動">再等等</button>'
    +'<button class="p" data-send2="'+esc(card.card)+"|"+esc(sel)+'">要改：換成 '+esc(sel)+' 縮圖</button>'
    +'</div><div class="dim" style="text-align:center">換縮圖＝退回重做發布包，不會公開</div></div>';
  else foot='<div class="dwf"><div class="r">'
    +'<button data-act="'+esc(card.card)+'|不動">再等等</button>'
    +'<button data-act="'+esc(card.card)+'|改">要改…</button>'
    +'<button class="p" data-act="'+esc(card.card)+'|准">'
    +(view.confirm===card.card?"確定放行？再按一次":"放行公開"+(pick?"（用 "+esc(pick)+"）":""))
    +'</button></div>'
    +(view.noteOpen===card.card?'<textarea id="note" placeholder="要改什麼？一句話">'
      +esc(view.notes[card.card]||"")+'</textarea>'
      +(view.hint?'<div class="hint">'+esc(view.hint)+'</div>':"")
      +'<div class="r"><button class="p" data-send="'+esc(card.card)+'">送出「改」</button></div>'
      :'<div class="dim" style="text-align:center">按下去會再問一次確認；公開後不能收回</div>')
    +'</div>';
  return head+body+foot;
}
function dwVideo(f){
  var c=f.c, v=f.v, pub=f.pub||{};
  var title=(v&&v.title)||pub.title||"";
  var head=dwHead(c.name+" › "+((v&&v.tc)||"已公開"), title,
    [pub.short?"Shorts":"長片", (pub.date||(v&&v.published))?md(pub.date||v.published)+" 公開":""]
      .filter(Boolean).join("・"));
  var body='<div class="dwb">';
  body+='<section class="sec"><h3>成績</h3><div class="g3">'
    +'<div style="background:var(--soft);border-radius:10px;padding:9px 11px">'
    +'<span class="dim">累計觀看</span><b style="display:block;font-size:17px">'
    +(pub.views==null?"—":fmt(pub.views))+'</b>'
    +(pub.pred!=null?'<span class="dim">預測 '+fmt(pub.pred)+'</span>':'')+'</div>'
    +['48h','7d'].map(function(k){
      var s=(v&&v.snaps&&v.snaps[k])||{};
      return '<div style="background:var(--soft);border-radius:10px;padding:9px 11px">'
        +'<span class="dim">'+(k==="48h"?"前 48 小時":"前 7 天")+'</span>'
        +'<b style="display:block;font-size:17px">'+(s.views==null?"—":fmt(s.views))+'</b>'
        +'<span class="dim">'+(s.avp==null?"看完比例量不到":"看完 "+fmt(s.avp)+"%")+'</span></div>';
    }).join("")+'</div></section>';
  if(v&&(v.retention||[]).length){
    var pts=v.retention;
    body+='<section class="sec"><h3>觀眾看到哪裡就走</h3>'
      +svgLines(pts.map(function(p){ return Math.round(p.x*100)+"%"; }),
                [{name:"留下的人",color:"var(--accent)",pts:pts.map(function(p){return p.ratio;})}],
                [],180)
      +'<div class="dim">'+(v.ret_drop?("掉最多的地方在片長 "+Math.round(v.ret_drop.x*100)+"%")
        :"沒有明顯掉點")+'</div></section>';
  }
  if(v&&(v.traffic||[]).length){
    var cols=["var(--accent)","var(--series2)","var(--ok)","var(--warn)","var(--bad)","var(--dim)"];
    body+='<section class="sec"><h3>觀眾從哪裡來</h3>'
      +'<div style="display:flex;height:10px;border-radius:999px;overflow:hidden">'
      +v.traffic.map(function(x,i){
        return '<i style="width:'+(x.pct||0)+'%;background:'+cols[i%cols.length]+'"></i>'; }).join("")
      +'</div><div class="stat">'+v.traffic.map(function(x,i){
        return '<span><span class="chip" style="background:'+cols[i%cols.length]+'"></span>'
          +esc(x.zh)+' '+(x.pct==null?"—":x.pct+"%")+'</span>'; }).join("")+'</div></section>';
  }
  if(v&&(v.verdict||[]).length){
    body+='<section class="sec"><h3>上架前的預測準不準</h3><table>'
      +'<tr><th>項</th><th>預測</th><th>實際</th><th>判定</th></tr>'
      +v.verdict.map(function(x){
        var cls=x.hit==="命中"?"ok":(x.hit==="未命中"?"bad":"dim");
        return '<tr><td>'+esc(x.metric)+'</td><td>'+esc(x.pred||"—")+'</td>'
          +'<td>'+(x.actual==null?"—":fmt(x.actual))+'</td>'
          +'<td class="'+cls+'">'+esc(x.hit)+'</td></tr>';
      }).join("")+'</table></section>';
  }
  var k=(v&&v.cost)||{};
  body+='<section class="sec"><h3>這支片花了多少</h3>'
    +'<div class="dim">現金 '+(k.cash==null?"—":"US$"+fmt(k.cash))+'・訂閱等值 '
    +(k.llm_equiv==null?"—":"US$"+fmt(k.llm_equiv))+'・顯卡 '+fmt(k.gpu_min)+' 分</div></section>';
  body+='</div>';
  return head+body+'<div class="dwf"><button id="dwc" style="justify-content:center">關閉</button></div>';
}
function drawer(){
  if(!view.film) return "";
  var f=filmOf(view.film);
  if(!f) return "";
  if(view.doc){
    var d=view.doc;
    return '<div class="dwbg" id="dwbg"></div><aside class="dw" role="dialog" aria-label="文件">'
      +'<div class="dwh"><h2 style="flex:1">'+esc(plain(d.title))+'</h2>'
      +'<button class="g" id="dwback" aria-label="返回">'+ico("left")+'</button></div>'
      +'<div class="dwb"><pre>'+esc(d.text)+'</pre></div></aside>';
  }
  return '<div class="dwbg" id="dwbg"></div><aside class="dw" role="dialog" aria-modal="true" '
    +'aria-label="單支片">'+(f.kind==="video"?dwVideo(f):dwFilm(f))+'</aside>';
}

/* ---------- 彈窗：只剩「設相關影片」與卡池確認 ---------- */
function cardModal(){
  var id=view.card, r=id?cardOf(id):null;
  if(!r) return "";
  return '<div class="doc" id="mbg"><div role="dialog" aria-modal="true" aria-label="待辦">'
    +'<div class="dim">'+esc(askMeta(r))+'<button class="g" id="mx" style="margin-left:auto" '
    +'aria-label="關閉">'+ico("x")+'</button></div>'
    +'<h2>'+esc(plain(r.title))+'</h2>'
    +'<div style="font-size:13px">'+esc(plain(r.note||""))+'</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
    +'<a class="btn" href="'+esc(r.url||"#")+'" target="_blank" rel="noopener">到後台設定 ↗</a>'
    +'<button class="p" data-rel="'+esc(r.card)+'">已設好</button></div></div></div>';
}
function poolModal(){
  var a=view.poolAsk;
  if(!a) return "";
  return '<div class="doc" id="pbg"><div role="dialog" aria-modal="true" aria-label="選題池確認">'
    +'<div class="dim">選題<button class="g" id="px" style="margin-left:auto" aria-label="關閉">'
    +ico("x")+'</button></div>'
    +'<h2>'+esc(plain(a.title)||a.tc)+'</h2>'
    +'<div style="font-size:13px">'+(a.un?"解除之後這張會回到可開工，排到它就會開工。"
                                        :"擋下之後這張不會開工，隨時可以解除。")+'</div>'
    +'<div style="display:flex;gap:8px"><button class="p" id="pok">'
    +(a.un?"確定解除擋下":"確定擋下這張")+'</button><button id="pno">取消</button></div></div></div>';
}

/* ---------- 組裝 ---------- */
function body(){
  if(view.err) return '<div class="wrap"><section class="panel"><div class="pb">'
    +'<div class="err">'+esc(view.err)+'</div></div></section></div>';
  if(view.tab==="ch") return channelPage();
  if(view.tab==="inbox") return inboxPage();
  if(view.tab==="cost") return costPage();
  return overview();
}
/* 自動重讀（60 秒一輪）不得把老闆正在寫的字或開著的彈窗清掉：整頁重畫延後到彈窗關上
   或輸入框空了為止（deferred），關上時再補一次重讀。 */
function editing(){
  if(view.card||view.poolAsk) return true;
  var ae=document.activeElement;
  if(ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT")) return true;
  return Object.keys(view.notes).some(function(k){ return (view.notes[k]||"").trim()!==""; });
}
function render(auto){
  if(!snap) return false;
  if(auto&&editing()){ deferred=true; return false; }
  document.getElementById("app").innerHTML=
    topBar()+body()+navBottom()+drawer()+cardModal()+poolModal()+toastsHtml();
  wire();
  lockScroll(!!view.card||!!view.poolAsk);
  return true;
}
function openCard(id){
  if(!cardOf(id)){ toast("這張卡已經不在了（"+id+"）","bad"); return; }
  view.card=id; view.confirm=""; view.hint=""; view.noteOpen=""; render();
}
function closeCard(){                             // 關上就把草稿丟掉（草稿只活在開著的時候）
  var id=view.card;
  view.card=null; view.confirm=""; view.hint=""; view.noteOpen="";
  if(id) delete view.notes[id];
  lockScroll(false);
  render();
  if(deferred){ deferred=false; fetchSnap(); }
}
function closeFilm(){
  view.film=null; view.thumb=""; view.confirm=""; view.noteOpen=""; view.doc=null;
  render();
  if(deferred){ deferred=false; fetchSnap(); }
}
function go(tab){
  view.tab=tab; view.doc=null; view.poolAsk=null; view.film=null; view.pg={};
  if(tab==="ch"&&!ch(view.ch)) view.ch=((snap.channels||[])[0]||{}).slug||"";
  closeCard();
}
function openFilm(k){
  if(!filmOf(k)){ toast("這一支片已經不在產線上了","bad"); return; }
  view.film=k; view.thumb=""; view.confirm=""; view.noteOpen=""; view.doc=null; render();
}
function each(sel,fn){ Array.prototype.forEach.call(document.querySelectorAll(sel),fn); }
function wireToasts(){
  each("[data-tdrop]",function(b){ b.onclick=function(){ dropToast(+b.getAttribute("data-tdrop")); }; });
  each("[data-retry]",function(b){ b.onclick=function(){
    var t=view.toasts.filter(function(x){ return x.id===+b.getAttribute("data-retry"); })[0];
    if(t&&t.retry){ dropToast(t.id); t.retry(); } }; });
}
function wire(){
  wireToasts();
  var th=document.getElementById("th");
  if(th) th.onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var nx=cur==="dark"?"light":(cur==="light"?"auto":"dark");
    document.documentElement.setAttribute("data-theme",nx); localStorage.setItem(LS+"-theme",nx);
  };
  var out=document.getElementById("out");
  if(out) out.onclick=function(){ saveTok(null); snap=null; clearInterval(timer); renderLogin("已登出"); };
  each("[data-tab]",function(b){ b.onclick=function(){ go(b.getAttribute("data-tab")); }; });
  each("[data-ch]",function(b){ b.onclick=function(){
    view.ch=b.getAttribute("data-ch"); view.tab="ch"; view.chTab="over"; view.pane=0; render(); }; });
  each("[data-chtab]",function(b){ b.onclick=function(){
    view.chTab=b.getAttribute("data-chtab"); view.pg={}; render(); }; });
  each("[data-chnav]",function(b){ b.onclick=function(){ chHop(+b.getAttribute("data-chnav")); }; });
  each("[data-pane]",function(b){ b.onclick=function(){
    view.pane=Math.max(0,Math.min(2,view.pane+(+b.getAttribute("data-pane")))); render(); }; });
  each("[data-pg]",function(b){ b.onclick=function(){
    var p=b.getAttribute("data-pg").split("|");
    view.pg[p[0]]=Math.max(0,(view.pg[p[0]]||0)+(+p[1])); render(); }; });
  each("[data-film]",function(b){ b.onclick=function(){ openFilm(b.getAttribute("data-film")); }; });
  each("[data-open]",function(b){ b.onclick=function(){ openCard(b.getAttribute("data-open")); }; });
  each("[data-thumb]",function(b){ b.onclick=function(){
    view.thumb=b.getAttribute("data-thumb"); render(); }; });
  var dwx=document.getElementById("dwx"), dwc=document.getElementById("dwc"),
      dwbg=document.getElementById("dwbg"), dwb=document.getElementById("dwback");
  if(dwx) dwx.onclick=closeFilm;
  if(dwc) dwc.onclick=closeFilm;
  if(dwbg) dwbg.onclick=closeFilm;
  if(dwb) dwb.onclick=function(){ view.doc=null; render(); };
  var mx=document.getElementById("mx"), mbg=document.getElementById("mbg");
  if(mx) mx.onclick=function(){ closeCard(); };
  if(mbg) mbg.onclick=function(e){ if(e.target===mbg) closeCard(); };
  var ta=document.getElementById("note");
  if(ta) ta.oninput=function(){ view.notes[view.noteOpen]=ta.value; view.hint=""; };
  each("[data-doc]",function(b){ b.onclick=function(){
    var p=b.getAttribute("data-doc").split("|"), r=cardOf(p[0]);
    view.doc=((r&&r.docs)||[])[+p[1]]; render(); }; });
  each("[data-act]",function(b){ b.onclick=function(){
    var p=b.getAttribute("data-act").split("|"); act(p[0],p[1]); }; });
  each("[data-send]",function(b){ b.onclick=function(){ sendNote(b.getAttribute("data-send")); }; });
  each("[data-send2]",function(b){ b.onclick=function(){
    var p=b.getAttribute("data-send2").split("|");
    decide(p[0],"改","換成 "+p[1]+" 縮圖"); }; });
  each("[data-rel]",function(b){ b.onclick=function(){ relDone(b.getAttribute("data-rel")); }; });
  each("[data-pool]",function(b){ b.onclick=function(){
    var p=b.getAttribute("data-pool").split(":"), c=ch(p[0]);
    var card=((c&&c.pool)||[]).filter(function(x){ return x.tc===p[1]; })[0]||{};
    view.poolAsk={slug:p[0],tc:p[1],un:p[2]==="un",title:card.title||""}; render(); }; });
  var px=document.getElementById("px"), pbg=document.getElementById("pbg");
  if(px) px.onclick=function(){ view.poolAsk=null; render(); };
  if(pbg) pbg.onclick=function(e){ if(e.target===pbg){ view.poolAsk=null; render(); } };
  var pno=document.getElementById("pno");
  if(pno) pno.onclick=function(){ view.poolAsk=null; render(); };
  var pok=document.getElementById("pok");
  if(pok) pok.onclick=function(){ var a=view.poolAsk; if(a) poolToggle(a.slug,a.tc,a.un); };
  wireSwipe();
}
function chHop(d){                                 // 換頻道（桌機按鈕、手機左右滑）
  var cs=snap.channels||[];
  if(!cs.length) return;
  var i=(chIdx()+d+cs.length)%cs.length;
  view.ch=cs[i].slug; view.pane=0; view.pg={}; view.film=null; render();
}
function wireSwipe(){
  if(view.tab!=="ch"||view.film) return;
  var app=document.getElementById("app"), x0=null, y0=null;
  app.ontouchstart=function(e){
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  };
  app.ontouchend=function(e){
    if(x0===null) return;
    var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    x0=null;
    if(Math.abs(dx)<60||Math.abs(dy)>50) return;
    if(window.innerWidth<=820&&view.chTab==="over"){
      var n=view.pane+(dx<0?1:-1);
      if(n>=0&&n<=2){ view.pane=n; render(); return; }
    }
    chHop(dx<0?1:-1);
  };
}
/* ---------- 動作：都以卡號為鍵，送出成功就關抽屜、卡變處理中、結果走提示 ---------- */
function act(card,verdict){
  var r=cardOf(card);
  if(!r){ closeFilm(); toast("這張卡已被處理","bad"); return; }
  if(verdict==="改"){ view.noteOpen=card; view.confirm=""; view.hint=""; render();
    var ta=document.getElementById("note"); if(ta&&ta.focus) ta.focus(); return; }
  if(verdict==="准"&&view.confirm!==card){      // 二段確認：按一次先變成問句，不用原生 confirm
    view.confirm=card; render(); return;
  }
  decide(card,verdict,"");
}
function sendNote(card){
  var t=(view.notes[card]||"").trim();
  if(!t){ view.hint="「改」要寫一句意見，不然產線不知道改什麼。"; render(); return; }
  decide(card,"改",t);
}
function decide(card,verdict,note){
  var r=cardOf(card);
  if(!r){ closeFilm(); toast("這張卡已被處理","bad"); return; }
  var action={kind:"decide",channel:r.channel,build:r.build||"",card:card,verdict:verdict,note:note};
  submit(card,action,(r.build||"這張卡")+" 裁「"+verdict+"」",function(){ decide(card,verdict,note); });
}
function relDone(card){
  var r=cardOf(card);
  if(!r){ closeCard(); toast("這張卡已被處理","bad"); return; }
  submit(card,{kind:"related-done",channel:r.channel,build:r.build,card:card,verdict:"",note:""},
         (r.build||"這張卡")+" 已設好",function(){ relDone(card); });
}
/* 卡池擋下／解除（ER-142）：先彈窗確認 → 卡立刻換邊（樂觀）→ 結果走提示；
   送不出去就把樂觀值收回來，列表回到原樣。 */
function poolToggle(slug,tc,un){
  view.poolOpt[slug+":"+tc]=!un; view.poolAsk=null; render();
  var label=(un?"解除擋下 ":"擋下 ")+tc;
  var tid=toast("已送出："+label,"wait");
  sendAction({kind:un?"pool-unblock":"pool-block",channel:slug,build:tc,card:"",verdict:"",note:""})
    .then(function(row){ waitAction(row.id,function(res){
      dropToast(tid); toast("已完成："+label+"（"+res+"）"); }); })
    .catch(function(e){
      delete view.poolOpt[slug+":"+tc];           // 沒送出去就不要假裝擋下了
      dropToast(tid); render();
      toast("送不出去："+(e.message||e),"bad",function(){ poolToggle(slug,tc,un); });
    });
}

/* ---------- 起步 ---------- */
function start(){
  fetchSnap();
  clearInterval(timer);
  timer=setInterval(function(){ if(!document.hidden) fetchSnap(true); },60000);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) fetchSnap(true); });
  if(!start.keyed){                              // Esc 關抽屜與彈窗（只掛一次）
    start.keyed=true;
    document.addEventListener("keydown",function(e){
      if(e.key!=="Escape") return;
      if(view.poolAsk){ view.poolAsk=null; render(); return; }
      if(view.card){ closeCard(); return; }
      if(view.film) closeFilm();
    });
  }
}
(function(){
  var t=localStorage.getItem(LS+"-theme");
  if(t) document.documentElement.setAttribute("data-theme",t);
  cfg=loadCfg();
  if(!cfg){ renderSetup(); return; }
  tok=loadTok();
  if(!tok){ renderLogin(""); return; }
  refresh().then(start).catch(function(){ renderLogin("請重新登入"); });
})();
</script>
