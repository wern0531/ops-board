<!doctype html>
<html lang="zh-Hant" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>工廠看板</title>
<!--
  老闆看板前端（ER-134 起；ER-139 第二版：滿版、圖表優先、詳細另頁、手機只留重點）。
  單檔、零相依、零建置：推到公開 repo wern0531/ops-board，GitHub Pages 服務。
  紅線：這個檔**不含任何金鑰、資料、本機路徑**。專案網址與 publishable key 由 CEO 給的設定連結
  （#u=…&k=…）帶進來存 localStorage——片段不會送到任何伺服器，也不進 repo。
  沒登入什麼都拿不到：所有資料都要帶 Supabase 的登入 JWT 才讀得到（RLS 只開給 authenticated）。

  資訊三層，每層只回答一個問題：
    首頁＝「正常嗎？成績變好還是變差？」／分頁＝總覽・頻道・影片成績・產線・成本／詳細＝一支片一頁。
    彈窗只用在決策卡（摘要＋三顆按鈕＋文件連結），其他細節一律另一頁。
  圖全部手畫 SVG，不載任何圖表庫。
  兩列快照：current（20 秒一輪，產線狀態）＋analytics（一天一次，趨勢與圖表）。
-->
<style>
:root{
  --bg:#eef3f7; --card:#fffdf9; --line:#dfe4ee; --ink:#232a3d; --dim:#6b7390;
  --ok:#2e7d64; --warn:#9a6b1f; --bad:#b4453f; --accent:#2f6fb3; --accent2:#b4652a;
  --shadow:0 1px 3px rgba(40,50,90,.10);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171b24; --card:#1f242f; --line:#2d3340; --ink:#e7ebf3; --dim:#98a1b6;
  --ok:#5fbf9d; --warn:#d9ab57; --bad:#e2756c; --accent:#6aa7e0; --accent2:#d98f55;
  --shadow:0 1px 3px rgba(0,0,0,.35);
}}
html[data-theme=light]{--bg:#eef3f7;--card:#fffdf9;--line:#dfe4ee;--ink:#232a3d;--dim:#6b7390;
  --ok:#2e7d64;--warn:#9a6b1f;--bad:#b4453f;--accent:#2f6fb3;--accent2:#b4652a;
  --shadow:0 1px 3px rgba(40,50,90,.10)}
html[data-theme=dark]{--bg:#171b24;--card:#1f242f;--line:#2d3340;--ink:#e7ebf3;--dim:#98a1b6;
  --ok:#5fbf9d;--warn:#d9ab57;--bad:#e2756c;--accent:#6aa7e0;--accent2:#d98f55;
  --shadow:0 1px 3px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
.page{padding:10px 14px 24px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px;box-shadow:var(--shadow)}
h1{font-size:17px;margin:0}
h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .c{color:var(--dim);font-size:12px;font-weight:400}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar.red{background:var(--bad);color:#fff}
.bar.red .dim,.bar.red select,.bar.red button{color:#fff}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.big{font-size:13px;font-weight:600;background:var(--warn);border-color:var(--warn);color:#fff;cursor:pointer}
.dim{color:var(--dim);font-size:12px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow)}
.kpi span{color:var(--dim);font-size:12px;display:block}
.kpi b{display:block;font-size:22px;font-weight:600;line-height:1.25}
.kpi.red b{color:var(--bad)}
.mid{display:grid;gap:10px;grid-template-columns:minmax(0,2fr) minmax(0,1fr);margin:10px 0}
.row{border-top:1px solid var(--line);padding:8px 0}
.row:first-of-type{border-top:0}
.chip{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:6px}
.depts{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 2px}
.dept{flex:1 1 40px;min-width:40px;text-align:center;font-size:10px;padding:4px 1px;border-radius:5px;
  background:var(--bg);border:1px solid var(--line);color:var(--dim);overflow:hidden;white-space:nowrap}
.dept.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.dept.wait{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:600}
.dept.stuck{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--bg);
  color:var(--ink);padding:6px 11px;min-height:34px}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
button.g{background:transparent}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:8px;width:100%;min-height:36px}
textarea{min-height:64px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;white-space:nowrap;vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.muted{opacity:.55}
.tabs{display:flex;gap:6px;padding:0 14px}
.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.bc{position:relative;height:9px;background:var(--bg);border:1px solid var(--line);border-radius:5px;min-width:70px}
.bc i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bc i.o{background:var(--accent2)}
.bc u{position:absolute;top:-4px;width:2px;height:15px;background:var(--ink);opacity:.75}
.bv{font-size:11px;color:var(--dim)}
.mix{display:flex;height:16px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.mix i{display:block;height:100%}
svg{display:block;width:100%;height:auto}
.spark{width:112px;height:26px}
.doc{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.doc>div{background:var(--card);width:100%;max-width:640px;max-height:86vh;overflow:auto;border-radius:14px;padding:14px}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.65 ui-monospace,"Noto Sans TC",monospace;margin:0}
.login{max-width:330px;margin:14vh auto}
.err{color:var(--bad);font-size:13px;margin-top:8px;word-break:break-word}
.stat{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.mob{display:none}
.nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);
  border-top:1px solid var(--line);padding:4px}
.nav button{flex:1;border:0;background:transparent;font-size:13px;min-height:44px}
.nav button[aria-selected=true]{color:var(--accent);font-weight:700}
@media (max-width:820px){
  .desk{display:none!important}
  .mob{display:block}
  .nav{display:flex}
  .page{padding:8px 10px 64px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mid{grid-template-columns:minmax(0,1fr)}
  .tabs{display:none}
  .bar{padding:8px 10px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
var LS="aicc-board";
var cfg=null, tok=null, snap=null, ana=null, at="", anaAt="", timer=null;
var view={tab:"home", ch:"", vid:"", card:null, doc:null, err:""};
var DESK=[["home","總覽"],["channels","頻道"],["scores","影片成績"],["line","產線"],["cost","成本"]];
var MOB=[["home","首頁"],["inbox","等你"],["scores","成績"],["line","產線"]];

/* ---------- 設定（專案網址＋publishable key）：只從設定連結或 localStorage 來 ---------- */
function readFragment(){
  var h=location.hash.replace(/^#/,""); if(!h) return null;
  var p=new URLSearchParams(h), u=p.get("u"), k=p.get("k");
  if(!u||!k) return null;
  var c={url:u.replace(/\/+$/,""),key:k};
  localStorage.setItem(LS+"-cfg",JSON.stringify(c));
  history.replaceState(null,"",location.pathname+location.search);   // 片段不留在網址列
  return c;
}
function loadCfg(){
  return readFragment()||JSON.parse(localStorage.getItem(LS+"-cfg")||"null");
}
function loadTok(){ return JSON.parse(localStorage.getItem(LS+"-tok")||"null"); }
function saveTok(t){ tok=t; t?localStorage.setItem(LS+"-tok",JSON.stringify(t)):localStorage.removeItem(LS+"-tok"); }

/* ---------- Supabase（手寫 fetch，不載任何第三方 SDK） ---------- */
function api(path,opt){
  opt=opt||{};
  var h={apikey:cfg.key,"Content-Type":"application/json"};
  if(tok&&tok.access_token) h.Authorization="Bearer "+tok.access_token;
  Object.keys(opt.headers||{}).forEach(function(k){h[k]=opt.headers[k];});
  return fetch(cfg.url+path,{method:opt.method||"GET",headers:h,
    body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){
    return r.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){ j=t; }
      return {ok:r.ok,status:r.status,data:j};
    });
  });
}
function login(email,pw){
  return api("/auth/v1/token?grant_type=password",{method:"POST",body:{email:email,password:pw}})
    .then(function(r){
      if(!r.ok) throw new Error((r.data&&(r.data.error_description||r.data.msg||r.data.error))||("登入失敗 "+r.status));
      saveTok(r.data); return r.data;
    });
}
function refresh(){
  if(!tok||!tok.refresh_token) return Promise.reject(new Error("沒有登入"));
  return api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:{refresh_token:tok.refresh_token}})
    .then(function(r){ if(!r.ok) throw new Error("登入過期"); saveTok(r.data); return r.data; });
}
function authed(path,opt){                       // 401 先換一次 token，再失敗才真的登出
  return api(path,opt).then(function(r){
    if(r.status!==401) return r;
    return refresh().then(function(){ return api(path,opt); });
  });
}
function fetchSnap(){                            // 兩列一次拿：current（產線）＋analytics（圖表）
  return authed("/rest/v1/board_snapshot?key=in.(current,analytics)&select=key,at,data")
    .then(function(r){
    if(!r.ok) throw new Error("讀不到資料（"+r.status+"）");
    if(!r.data||!r.data.length) throw new Error("還沒有快照（本機還沒推第一輪）");
    r.data.forEach(function(row){
      if(row.key==="analytics"){ ana=row.data; anaAt=row.at; }
      else { snap=row.data; at=row.at; }
    });
    if(!snap) throw new Error("只有分析資料，還沒有產線快照");
    view.err=""; render();
  }).catch(function(e){ view.err=e.message||String(e); render(); });
}
function sendAction(a){
  return authed("/rest/v1/board_actions",{method:"POST",body:[a],
    headers:{Prefer:"return=representation"}}).then(function(r){
    if(!r.ok) throw new Error((r.data&&(r.data.message||r.data.hint))||("送不出去 "+r.status));
    return r.data[0];
  });
}
function waitAction(id,cb){                      // 等本機那一輪把它落地（applied_at 回填）
  var n=0;
  var iv=setInterval(function(){
    n++;
    authed("/rest/v1/board_actions?id=eq."+id+"&select=applied_at,result").then(function(r){
      var row=r.ok&&r.data&&r.data[0];
      if(row&&row.applied_at){ clearInterval(iv); cb(row.result||"已落地"); fetchSnap(); }
      else if(n>40){ clearInterval(iv); cb("本機還沒收到（下一輪會處理）"); }
    });
  },5000);
}

/* ---------- 小工具 ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function na(v,suf){ return (v===null||v===undefined||v==="")?'<span class="dim">量不到</span>':esc(v)+(suf||""); }
function fmt(n){
  if(n===null||n===undefined||n==="") return "—";
  var x=Math.round(Number(n)*10)/10;
  return String(x).replace(/\B(?=(\d{3})+(?!\d))/g,",");
}
function ago(s){
  var t=Date.parse(String(s||"").replace(" ","T")); if(!t) return "";
  var m=Math.round((Date.now()-t)/60000);
  return m<1?"剛剛":(m<60?m+" 分前":Math.floor(m/60)+" 小時前");
}
function hhmm(s){ var m=String(s||"").match(/(\d{2}):(\d{2})/); return m?m[1]+":"+m[2]:"—"; }
function md(s){ return String(s||"").slice(5); }        // 2026-10-30 → 10-30（X 軸標）
function ch(slug){ return (snap.channels||[]).filter(function(c){return c.slug===slug;})[0]||null; }
function chName(s){ var c=ch(s); return esc(c?c.name:s); }
function pushedAgo(){ var t=Date.parse(at||""); return t?Math.round((Date.now()-t)/1000):null; }
function anaChs(){                               // 照頻道切換濾出分析資料
  var cs=(ana&&ana.channels)||[];
  return view.ch?cs.filter(function(c){return c.slug===view.ch;}):cs;
}
function allVideos(){
  var out=[];
  anaChs().forEach(function(c){ (c.videos||[]).forEach(function(v){
    out.push(Object.assign({channel:c.slug,color:c.color},v)); }); });
  return out;
}
function vidOf(id){ return allVideos().filter(function(v){return v.video_id===id||v.tc===id;})[0]
  ||(((ana&&ana.channels)||[]).reduce(function(a,c){
       return a||(c.videos||[]).filter(function(v){return v.video_id===id||v.tc===id;})[0]||null; },null)); }
function sumDaily(days){                         // 最近 N 天觀看（長片＋Shorts）
  var t=0, got=false;
  anaChs().forEach(function(c){ (c.daily||[]).slice(-days).forEach(function(d){
    got=true; t+=(d.long||0)+(d.short||0); }); });
  return got?t:null;
}
function latestSnap(v){                          // 一支片最後一格有資料的快照
  var got=null;
  ["48h","7d","28d"].forEach(function(k){
    var s=(v.snaps||{})[k];
    if(s&&(s.views!=null||s.avp!=null)) got=Object.assign({key:k},s);
  });
  return got;
}
function avgOf(key){
  var xs=allVideos().map(function(v){ var s=latestSnap(v); return s?s[key]:null; })
            .filter(function(x){return x!=null;});
  return xs.length?Math.round(xs.reduce(function(a,b){return a+b;},0)/xs.length*10)/10:null;
}

/* ---------- 手畫 SVG（不載圖表庫） ---------- */
function niceMax(v){
  if(!v||v<=0) return 1;
  var p=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)), n=v/p;
  return p*(n<=1?1:n<=2?2:n<=5?5:10);
}
function svgLines(labels,series,marks,h,xf){
  h=h||260; xf=xf||function(s){ return s; };
  var W=1000, L=48, R=12, T=14, B=26;
  var max=1;
  series.forEach(function(s){ (s.pts||[]).forEach(function(v){ if(v>max) max=v; }); });
  max=niceMax(max);
  var n=labels.length, iw=W-L-R, ih=h-T-B;
  var X=function(i){ return L+(n<2?iw/2:iw*i/(n-1)); };
  var Y=function(v){ return T+ih-ih*(Number(v||0)/max); };
  var g="";
  for(var k=0;k<=4;k++){
    var val=max*k/4, y=Y(val);
    g+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="currentColor" stroke-opacity=".16"/>'
      +'<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="currentColor" fill-opacity=".55">'
      +fmt(val)+'</text>';
  }
  [0,Math.floor((n-1)/2),n-1].forEach(function(i,j){
    if(i<0||!labels[i]) return;
    g+='<text x="'+X(i)+'" y="'+(h-7)+'" text-anchor="'+(j===0?"start":j===2?"end":"middle")
      +'" font-size="12" fill="currentColor" fill-opacity=".55">'+esc(xf(String(labels[i])))+'</text>';
  });
  (marks||[]).forEach(function(m){
    if(m.i<0||m.i>=n) return;
    g+='<line x1="'+X(m.i)+'" y1="'+T+'" x2="'+X(m.i)+'" y2="'+(h-B)+'" stroke="'+(m.color||"currentColor")
      +'" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity=".7"><title>'+esc(m.label||"")+'</title></line>'
      +'<circle cx="'+X(m.i)+'" cy="'+(T+4)+'" r="4" fill="'+(m.color||"currentColor")+'"><title>'
      +esc(m.label||"")+'</title></circle>';
  });
  series.forEach(function(s){
    var pts=s.pts||[]; if(!pts.length) return;
    var d=pts.map(function(v,i){ return (i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1); }).join(" ");
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" stroke-linejoin="round"/>';
  });
  return '<svg viewBox="0 0 '+W+' '+h+'" role="img">'+g+'</svg>';
}
function legend(series){
  return '<div class="stat">'+series.map(function(s){
    return '<span><span class="chip" style="background:'+s.color+'"></span>'+esc(s.name)+'</span>';
  }).join("")+'</div>';
}
function spark(pts,color){
  pts=(pts||[]).filter(function(v){return v!=null;});
  if(pts.length<2) return '<div class="dim">趨勢還不夠畫</div>';
  var W=112,H=26,max=Math.max.apply(null,pts)||1,min=Math.min.apply(null,pts);
  var rng=(max-min)||1;
  var d=pts.map(function(v,i){
    return (i?"L":"M")+(i*(W-2)/(pts.length-1)+1).toFixed(1)+" "+(H-1-(v-min)/rng*(H-3)).toFixed(1);
  }).join(" ");
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img">'
    +'<path d="'+d+'" fill="none" stroke="'+(color||"var(--accent)")+'" stroke-width="1.8"/></svg>';
}
function meter(v,cap,alt){                        // 進度條；超上限變紅
  if(v==null||cap==null||!cap) return '<div class="dim">'+(alt||"沒有上限可比")+'</div>';
  var pct=v/cap*100, over=pct>100;
  return '<div class="bc"><i class="'+(over?"":"")+'" style="width:'+Math.min(100,Math.max(2,pct)).toFixed(0)+'%;'
    +(over?"background:var(--bad)":"")+'"></i></div>'
    +'<span class="bv">'+fmt(v)+' ／ '+fmt(cap)+'（'+pct.toFixed(0)+'%）</span>';
}
function barCell(v,max,pred,suf){                 // 一根條＋刻線（刻線＝阿題預測）
  if(v==null) return '<td class="dim">量不到</td>';
  var w=Math.min(100,Math.max(2,100*v/(max||1)));
  var t=(pred!=null&&max)?Math.min(100,100*pred/max):null;
  return '<td><div class="bc"><i style="width:'+w.toFixed(0)+'%"></i>'
    +(t!=null?'<u style="left:'+t.toFixed(0)+'%" title="預測 '+fmt(pred)+'"></u>':'')+'</div>'
    +'<span class="bv">'+fmt(v)+(suf||"")+(pred!=null?'（預測 '+fmt(pred)+(suf||"")+'）':'')+'</span></td>';
}

/* ---------- 登入／設定 ---------- */
function renderLogin(msg){
  document.getElementById("app").innerHTML=
   '<div class="login box"><h1>工廠看板</h1>'
   +'<p class="dim">要老闆的帳號密碼。沒登入看不到任何資料。</p>'
   +'<p><input id="em" type="email" inputmode="email" autocomplete="username" placeholder="電子郵件"></p>'
   +'<p><input id="pw" type="password" autocomplete="current-password" placeholder="密碼"></p>'
   +'<p><button class="p" id="go" style="width:100%">登入</button></p>'
   +(msg?'<div class="err">'+esc(msg)+'</div>':'')+'</div>';
  var go=function(){
    var b=document.getElementById("go"); b.disabled=true; b.textContent="登入中…";
    login(document.getElementById("em").value.trim(),document.getElementById("pw").value)
      .then(function(){ start(); })
      .catch(function(e){ renderLogin(e.message||"登入失敗"); });
  };
  document.getElementById("go").onclick=go;
  document.getElementById("pw").onkeydown=function(e){ if(e.key==="Enter") go(); };
}
function renderSetup(){
  document.getElementById("app").innerHTML=
   '<div class="login box"><h1>還沒設定</h1><p class="dim">'

      return '<div class="row'+(r.gate_open?"":" muted")+'">'
        +'<span class="chip" style="background:'+esc(c?c.color:"#888")+'"></span>'
        +'<b>'+esc(r.card)+'</b> '+(r.build?'<span class="pill">'+esc(r.build)+'</span>':"")
        +'<span class="dim">'+esc(c?c.name:r.channel||"非產線")+'</span>'
        +(r.kind==="related"?'<span class="pill">設相關影片</span>':"")
        +(r.gate_open?'':'<span class="pill muted">關卡已過・卡未結</span>')
        +'<div style="margin:6px 0">'+esc(r.title)+'</div>'
        +'<div class="stat">提出 '+esc(r.date)+'・期限 '+esc(r.due)+'・逾期預設：'+esc(r.default||"—")+'</div>'
        +'<div class="acts"><button class="p" data-open="'+i+'">打開決策卡</button></div></div>';
    }).join("")+'</div></div>';
}

/* ---------- 詳細：一支片一頁 ---------- */
function retChart(v){
  var pts=(v.retention||[]);
  if(!pts.length) return '<div class="dim">量不到：'+esc(v.ret_why||"沒有留存資料")+'</div>';
  var labels=pts.map(function(p){ return Math.round(p.x*100)+"% 處"; });
  var series=[{name:"觀眾留存",color:"var(--accent)",pts:pts.map(function(p){return p.ratio;})}];
  var marks=[];
  if(v.ret_drop){
    var i=pts.map(function(p){return p.x;}).indexOf(v.ret_drop.x);
    if(i>=0) marks.push({i:i,color:"var(--bad)",
      label:"最大掉點：片長 "+Math.round(v.ret_drop.x*100)+"% 處掉 "+v.ret_drop.drop});
  }
  return svgLines(labels,series,marks,200)+legend(series)
    +'<div class="dim">'+(v.ret_drop?("最大掉點在片長 "+Math.round(v.ret_drop.x*100)+"%（掉 "
      +v.ret_drop.drop+"）"):"沒有明顯掉點")+'</div>';
}
function mixBar(v){
  var t=(v.traffic||[]);
  if(!t.length) return '<div class="dim">量不到：流量來源報表還沒含這一支</div>';
  var cols=["var(--accent)","var(--accent2)","var(--ok)","var(--warn)","var(--bad)","var(--dim)"];
  return '<div class="mix">'+t.map(function(x,i){
      return '<i style="width:'+(x.pct||0)+'%;background:'+cols[i%cols.length]+'" title="'
        +esc(x.zh)+' '+(x.pct||0)+'%"></i>';
    }).join("")+'</div>'
    +'<div class="stat">'+t.map(function(x,i){
      return '<span><span class="chip" style="background:'+cols[i%cols.length]+'"></span>'
        +esc(x.zh)+' '+(x.pct==null?"—":x.pct+"%")+'（'+fmt(x.views)+'）</span>';
    }).join("")+'</div>';
}
function videoPage(){
  var v=vidOf(view.vid);
  if(!v) return '<div class="page"><div class="box">找不到這支片的分析資料。'
    +'<div class="acts"><button id="back">← 返回</button></div></div></div>';
  var S=["48h","7d","28d"];
  var mv=niceMax(Math.max.apply(null,[1].concat(S.map(function(k){
    return (v.snaps[k]||{}).views||0; }))));
  var h='<div class="page"><div class="box"><h2>'
    +'<button class="g" id="back">← 返回</button>'+esc(v.tc)
    +'<span class="c">'+esc(v.kind==="short"?"Shorts":"長片")+'・'+esc(v.published||"")+'</span></h2>'
    +'<div>'+esc(v.title)+'</div></div>';
  /* ① 三快照 */
  h+='<div class="mid"><div class="box"><h2>三快照<span class="c">48h／7d／28d</span></h2>'
    +'<div class="scroll"><table><tr><th>格</th><th>觀看</th><th>平均觀看比例</th><th>30 秒留存</th>'
    +'<th>曝光</th><th>CTR</th></tr>'
    +S.map(function(k){
      var s=v.snaps[k]||{};
      if(s.views==null&&s.avp==null)
        return '<tr><td>'+k+'</td><td colspan="5" class="dim">量不到：'+esc(s.why||"")+'</td></tr>';
      return '<tr><td><b>'+k+'</b></td>'+barCell(s.views,mv,k==="48h"?(v.pred_num||{}).views_48h
          :(k==="7d"?(v.pred_num||{}).views_7d:null))
        +'<td>'+(s.avp==null?'<span class="dim">—</span>':fmt(s.avp)+"%")+'</td>'
        +'<td>'+(s.ret30==null?'<span class="dim">—</span>':fmt(s.ret30))+'</td>'
        +'<td>'+(s.impressions==null?'<span class="dim">—</span>':fmt(s.impressions))+'</td>'
        +'<td>'+(s.ctr==null?'<span class="dim">—</span>':fmt(s.ctr)+"%")+'</td></tr>';
    }).join("")+'</table></div></div>';
  /* ② 留存曲線 */
  h+='<div class="box"><h2>留存曲線<span class="c">紅虛線＝最大掉點</span></h2>'+retChart(v)+'</div></div>';
  /* ③ 流量來源＋④ 曝光與 CTR */
  h+='<div class="mid"><div class="box"><h2>流量來源</h2>'+mixBar(v)+'</div>'
    +'<div class="box"><h2>曝光與 CTR</h2>'
    +(v.reach.impressions==null?'<div class="dim">量不到：'+esc(v.reach.why||"")+'</div>'
      :'<div class="row"><span>累計曝光</span><b>'+fmt(v.reach.impressions)+'</b>'
       +'<div class="dim">'+fmt(v.reach.days)+' 天的 Reporting 報表</div></div>'
       +'<div class="row"><span>累計 CTR</span><b>'+fmt(v.reach.ctr)+'%</b>'
       +'<div class="bc"><i style="width:'+Math.min(100,(v.reach.ctr||0)*10).toFixed(0)+'%"></i>'
       +((v.pred_num||{}).ctr!=null?'<u style="left:'+Math.min(100,(v.pred_num.ctr||0)*10).toFixed(0)
         +'%" title="預測 '+fmt(v.pred_num.ctr)+'%"></u>':"")+'</div>'
       +'<span class="bv">滿格＝10%'+((v.pred_num||{}).ctr!=null?'・刻線＝預測 '+fmt(v.pred_num.ctr)+'%':"")
       +'</span></div>')
    +'<div class="row"><span>每一格的曝光／CTR 在上面那張三快照表</span></div></div></div>';
  /* 預測 vs 實際逐項判定 */
  h+='<div class="box"><h2>預測 vs 實際<span class="c">逐項判定</span></h2>'
    +'<div class="scroll"><table><tr><th>項</th><th>預測</th><th>實際</th><th>判定</th><th>說明</th></tr>'
    +(v.verdict||[]).map(function(x){
      var cls=x.hit==="命中"?"ok":(x.hit==="未命中"?"bad":"dim");
      return '<tr><td>'+esc(x.metric)+'</td><td>'+esc(x.pred||"—")+'</td>'
        +'<td>'+(x.actual==null?'<span class="dim">量不到</span>':fmt(x.actual))+'</td>'
        +'<td class="'+cls+'">'+esc(x.hit)+'</td><td class="dim">'+esc(x.why||"")+'</td></tr>';
    }).join("")+'</table></div></div>';
  /* 這支片的成本（每站） */
  var k=v.cost||{};
  h+='<div class="box"><h2>這支片的成本<span class="c">現金 US$'+fmt(k.cash)+'・訂閱等值 US$'
    +fmt(k.llm_equiv)+'・顯卡 '+fmt(k.gpu_min)+' 分</span></h2>'
    +((k.by_station||[]).length?'<div class="scroll"><table><tr><th>站</th><th>現金</th>'
      +'<th>訂閱等值</th><th>顯卡分鐘</th></tr>'
      +k.by_station.map(function(s){
        return '<tr><td>'+esc(s.station)+'</td><td>US$'+fmt(s.cash)+'</td><td>US$'+fmt(s.llm_equiv)
          +'</td><td>'+fmt(s.gpu_min)+'</td></tr>';
      }).join("")+'</table></div>':'<div class="dim">量不到：'+esc(k.why||"")+'</div>')
    +'</div>';
  /* 這支片的逐日觀看 */
  if((v.daily||[]).length>1){
    var ds=v.daily.slice(-30);
    h+='<div class="box"><h2>逐日觀看<span class="c">最近 '+ds.length+' 天有資料的日子</span></h2>'
      +svgLines(ds.map(function(x){return x.d;}),
                [{name:"觀看",color:"var(--accent)",pts:ds.map(function(x){return x.views;})}],[],200,md)
      +'</div>';
  }
  return h+'</div>';
}

/* ---------- 決策卡彈窗（彈窗只用在這裡） ---------- */
function cardModal(){
  var i=view.card, r=(snap.inbox||[])[i];
  if(r===undefined||r===null) return "";
  var c=ch(r.channel);
  var head='<h2><span class="chip" style="background:'+esc(c?c.color:"#888")+'"></span>'
    +esc(r.card)+(r.build?' <span class="pill">'+esc(r.build)+'</span>':"")
    +'<span class="c">'+esc(c?c.name:r.channel||"非產線")+'</span>'
    +'<button class="g" id="mx" style="margin-left:auto">關閉</button></h2>';
  if(r.kind==="related"){
    return '<div class="doc" id="mbg"><div>'+head
      +'<div style="margin:6px 0">'+esc(r.title)+'</div>'
      +'<div class="stat">這支 Shorts '+esc(r.due)+' 公開</div>'
      +'<div class="acts"><a class="g" href="'+esc(r.url)+'" target="_blank" rel="noopener">到 Studio 設 →</a>'
      +'<button class="p" data-rel="'+i+'">已設好</button>'
      +'<span class="dim" id="res'+i+'"></span></div></div></div>';
  }
  var docs=(r.docs||[]).map(function(d,j){
    return '<button class="g" data-doc="'+i+":"+j+'">📄 '+esc(d.label)+'</button>';}).join("");
  return '<div class="doc" id="mbg"><div>'+head
    +(r.gate_open?'<span class="pill warn">關卡開著</span>'
                 :'<span class="pill muted">關卡已過・卡未結</span>')
    +'<div style="margin:6px 0">'+esc(r.title)+'</div>'
    +'<div class="stat">提出 '+esc(r.date)+'・期限 '+esc(r.due)+'・逾期預設：'+esc(r.default||"—")+'</div>'
    +(docs?'<div class="acts">'+docs+'</div>':"")
    +'<div class="acts">'
    +(r.ambiguous?'<select data-amb="'+i+'" style="width:auto">'+(snap.channels||[]).map(function(x){
        return '<option value="'+esc(x.slug)+'">'+esc(x.name)+'</option>';}).join("")+'</select>':"")
    +'<button class="p" data-act="'+i+':准">准</button>'
    +'<button data-act="'+i+':不動">不動</button>'
    +'<button data-act="'+i+':改">改…</button>'
    +'<span class="dim" id="res'+i+'"></span></div>'
    +'<div id="note'+i+'" style="display:none;margin-top:6px">'
    +'<textarea placeholder="要改什麼？一句話（會跟著裁示寫回決策卡）"></textarea>'
    +'<div class="acts"><button class="p" data-send="'+i+'">送出「改」</button></div></div>'
    +'</div></div>';
}
function docPage(){
  var d=view.doc;
  return '<div class="page"><div class="box"><h2>'+esc(d.title)
    +'<button class="g" id="back" style="margin-left:auto">← 返回</button></h2>'
    +(d.truncated?'<div class="dim">（太長，只推了前面一段）</div>':"")
    +'<pre>'+esc(d.text)+'</pre></div></div>';
}

/* ---------- 組裝 ---------- */
function body(){
  if(view.doc) return docPage();
  if(view.vid) return videoPage();
  if(view.tab==="channels") return channelsPage();
  if(view.tab==="scores") return '<div class="page">'+scoreTable(0)+'</div>';
  if(view.tab==="line") return linePage();
  if(view.tab==="cost") return costPage();
  if(view.tab==="inbox") return inboxPage();
  return home();
}
function render(){
  if(!snap) return;
  var app=document.getElementById("app");
  app.innerHTML=bar()+(view.err?'<div class="page"><div class="box err">'+esc(view.err)+'</div></div>':"")
    +body()+cardModal()+nav();
  wire();
}
function go(tab){ view.tab=tab; view.vid=""; view.doc=null; view.card=null; render(); window.scrollTo(0,0); }
function each(sel,fn){ Array.prototype.forEach.call(document.querySelectorAll(sel),fn); }
function wire(){
  var sel=document.getElementById("chsel");
  if(sel) sel.onchange=function(){ view.ch=sel.value; view.vid=""; render(); window.scrollTo(0,0); };
  var th=document.getElementById("th");
  if(th) th.onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var nx=cur==="dark"?"light":(cur==="light"?"auto":"dark");
    document.documentElement.setAttribute("data-theme",nx); localStorage.setItem(LS+"-theme",nx);
  };
  var out=document.getElementById("out");
  if(out) out.onclick=function(){ saveTok(null); snap=null; clearInterval(timer); renderLogin("已登出"); };
  var tg=document.getElementById("togo");
  if(tg) tg.onclick=function(){ go("inbox"); };
  var bk=document.getElementById("back");
  if(bk) bk.onclick=function(){ view.doc?(view.doc=null):(view.vid=""); render(); };
  each("[data-tab]",function(b){ b.onclick=function(){ go(b.getAttribute("data-tab")); }; });
  each("[data-vid]",function(b){ b.onclick=function(){
    view.vid=b.getAttribute("data-vid"); view.card=null; render(); window.scrollTo(0,0); }; });
  each("[data-open]",function(b){ b.onclick=function(){
    view.card=+b.getAttribute("data-open"); render(); }; });
  var mx=document.getElementById("mx"), mbg=document.getElementById("mbg");
  if(mx) mx.onclick=function(){ view.card=null; render(); };
  if(mbg) mbg.onclick=function(e){ if(e.target===mbg){ view.card=null; render(); } };
  each("[data-doc]",function(b){ b.onclick=function(){
    var p=b.getAttribute("data-doc").split(":");
    view.doc=(snap.inbox[+p[0]].docs||[])[+p[1]]; view.card=null; render(); window.scrollTo(0,0); }; });
  each("[data-act]",function(b){ b.onclick=function(){
    var p=b.getAttribute("data-act").split(":"), i=+p[0], v=p[1];
    if(v==="改"){ document.getElementById("note"+i).style.display="block"; return; }
    decide(i,v,"");
  }; });
  each("[data-send]",function(b){ b.onclick=function(){
    var i=+b.getAttribute("data-send");
    var t=document.getElementById("note"+i).querySelector("textarea").value.trim();
    if(!t){ alert("「改」要寫一句意見"); return; }
    decide(i,"改",t); }; });
  each("[data-rel]",function(b){ b.onclick=function(){
    var i=+b.getAttribute("data-rel"), r=snap.inbox[i], o=document.getElementById("res"+i);
    b.disabled=true; o.textContent="送出中…";
    sendAction({kind:"related-done",channel:r.channel,build:r.build,card:r.card,verdict:"",note:""})
      .then(function(row){ waitAction(row.id,function(res){ o.textContent="→ "+res; }); })
      .catch(function(e){ o.textContent="失敗："+(e.message||e); }); }; });
  each("[data-pool]",function(b){ b.onclick=function(){
    var p=b.getAttribute("data-pool").split(":");
    b.disabled=true; b.textContent="送出中…";
    sendAction({kind:p[2]==="un"?"pool-unblock":"pool-block",channel:p[0],build:p[1],
                card:"",verdict:"",note:""})
      .then(function(row){ waitAction(row.id,function(r){ b.textContent=r; }); })
      .catch(function(e){ b.textContent="失敗："+(e.message||e); }); }; });
}
function decide(i,verdict,note){
  var r=snap.inbox[i], out=document.getElementById("res"+i);
  var slug=r.channel;
  if(r.ambiguous){
    var s=document.querySelector('[data-amb="'+i+'"]');
    slug=s?s.value:"";
    if(!slug){ out.textContent="請先選頻道"; return; }
  }
  if(verdict==="准"&&!confirm("要裁「准」嗎？"+(r.gate_open?"（會立刻放行 "+(r.build||"")+" 的關卡）":""))) return;
  out.textContent="送出中…";
  each('[data-act^="'+i+':"]',function(b){ b.disabled=true; });
  sendAction({kind:"decide",channel:slug,build:r.build||"",card:r.card,verdict:verdict,note:note})
    .then(function(row){ out.textContent="已送出，等本機落地…";
      waitAction(row.id,function(res){ out.textContent="→ "+res; }); })
    .catch(function(e){ out.textContent="失敗："+(e.message||e); });
}

/* ---------- 起步 ---------- */
function start(){
  fetchSnap();
  clearInterval(timer);
  timer=setInterval(function(){ if(!document.hidden) fetchSnap(); },60000);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) fetchSnap(); });
}
(function(){
  var t=localStorage.getItem(LS+"-theme");
  if(t) document.documentElement.setAttribute("data-theme",t);
  cfg=loadCfg();
  if(!cfg){ renderSetup(); return; }
  tok=loadTok();
  if(!tok){ renderLogin(""); return; }
  refresh().then(start).catch(function(){ renderLogin("請重新登入"); });
})();
</script>
</body>
</html>
